<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Voice Call</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        html, body { touch-action: manipulation; overscroll-behavior: none; }
        body { background: #07090e; color: #00ff66; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; overflow: hidden; }

        .box { background: #0b0e14; border: 1px solid #1f293d; padding: 24px 20px; border-radius: 16px; width: 92%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }

        h3 { color: #3b82f6; margin: 0 0 4px 0; font-size: 13px; letter-spacing: 1px; }

        .status { font-size: 14px; margin: 16px 0; color: #ffb74d; font-weight: bold; }
        .timer { display: none; font-size: 16px; color: #60a5fa; margin: 8px 0 12px 0; font-weight: bold; letter-spacing: 2px; }

        #signal-bar { display: none; font-size: 11px; margin: 8px 0; color: #9ca3af; }
        #signal-icon { font-weight: bold; }
        #signal-text { margin-left: 6px; font-weight: bold; font-size: 10px; }
        #stats-text { margin-left: 6px; opacity: 0.7; font-size: 10px; }

        /* Big ACCEPT button — only thing receiver sees */
        #accept-btn {
            display: none;
            background: #166534;
            color: #86efac;
            border: 2px solid #22c55e;
            padding: 24px;
            width: 100%;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
            margin-top: 10px;
            outline: none;
            letter-spacing: 1.5px;
            font-family: monospace;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
            50% { box-shadow: 0 0 0 14px rgba(34,197,94,0); }
        }

        /* Call controls — hidden until call active */
        #call-controls { display: none; }
        #call-controls.active { display: block; }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        #auto-hd-btn { grid-column: 1 / -1; padding: 14px 8px; font-size: 14px; border-radius: 10px; }
        .ctrl-btn { background: #1f293d; color: #d1d5db; border: none; padding: 12px 4px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; outline: none; font-family: monospace; }
        .ctrl-btn.active { background: #1e3a8a; color: #60a5fa; border: 1px solid #3b82f6; }

        .utility-btn { background: #14532d; color: #86efac; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; margin-bottom: 6px; outline: none; font-family: monospace; }
        .utility-btn.active { background: #713f12; color: #fde047; }

        #end-btn { display: none; background: #7f1d1d; color: #fca5a5; border: none; padding: 16px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; outline: none; margin-top: 6px; font-family: monospace; letter-spacing: 1px; }

        #touch-shield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99; display: none; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; color: #fde047; font-size: 14px; font-weight: bold; }
        #touch-shield.active { display: flex; }
    </style>
</head>
<body>
    <div id="touch-shield" onclick="handleShieldClick()">🔒 Locked<br><span style="font-size:11px; color:#9ca3af; font-weight:normal; display:block; margin-top:6px;">(Double tap to unlock)</span></div>

    <div class="box">
        <h3>VOICE_CALL</h3>

        <div id="call-status" class="status">Connecting...</div>
        <div id="call-timer" class="timer">00:00</div>

        <div id="signal-bar">
            <span id="signal-icon">▁▁▁▁</span>
            <span id="signal-text">--</span>
            <span id="stats-text"></span>
        </div>

        <!-- Receiver sees ONLY this -->
        <button id="accept-btn" onclick="acceptIncomingCall()">📞 ACCEPT</button>

        <audio id="remote-audio" autoplay playsinline></audio>
        <video id="remote-video-hidden" autoplay playsinline muted style="display:none;"></video>

        <!-- Controls appear only after call connected -->
        <div id="call-controls">
            <button id="fs-lock-btn" class="utility-btn" onclick="toggleFullscreenAndLock()" style="display:none;">⛶ Fullscreen & Lock</button>
            <button id="earpiece-btn" class="utility-btn active" onclick="toggleAudioOutput()" style="background:#713f12; color:#fde047;">🎧 Earpiece</button>

            <div class="controls-grid">
                <button id="mute-btn" class="ctrl-btn" onclick="toggleMute()">🎙️ Mute</button>
                <button id="speaker-btn" class="ctrl-btn" onclick="toggleAudioOutput()">🔊 Speaker</button>
                <button id="auto-hd-btn" class="ctrl-btn" onclick="toggleAutoHD()">⚡ Auto HD</button>
            </div>

            <button id="end-btn" onclick="endCallAndClose()">🔴 END CALL</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script>
    /* ============================================================
       SDP MUNGING — Opus
       ============================================================ */
    const _origCreateOffer = RTCPeerConnection.prototype.createOffer;
    const _origCreateAnswer = RTCPeerConnection.prototype.createAnswer;

    function mungeSDPForOpus(sdp) {
        if (!sdp || !/opus\/48000/i.test(sdp)) return sdp;
        const lines = sdp.split('\r\n');
        let opusPT = null;
        for (const l of lines) {
            const m = l.match(/^a=rtpmap:(\d+)\s+opus\/48000/i);
            if (m) { opusPT = m[1]; break; }
        }
        if (!opusPT) return sdp;
        const targetBitrate = (typeof isAutoHD !== 'undefined' && isAutoHD) ? 24000 : 16000;
        const out = [];
        for (const l of lines) {
            const prefix = 'a=fmtp:' + opusPT + ' ';
            if (l.startsWith(prefix)) {
                let parts = l.substring(prefix.length).split(';').map(s => s.trim()).filter(Boolean);
                const set = (k, v) => {
                    const i = parts.findIndex(p => p.startsWith(k + '='));
                    if (i >= 0) parts[i] = k + '=' + v; else parts.push(k + '=' + v);
                };
                set('useinbandfec', '1');
                set('usedtx', '1');
                set('stereo', '0');
                set('sprop-stereo', '0');
                set('maxaveragebitrate', String(targetBitrate));
                set('maxplaybackrate', '16000');
                out.push(prefix + parts.join(';'));
            } else out.push(l);
        }
        return out.join('\r\n');
    }

    RTCPeerConnection.prototype.createOffer = async function(...a) {
        const o = await _origCreateOffer.apply(this, a);
        if (o && o.sdp) o.sdp = mungeSDPForOpus(o.sdp);
        return o;
    };
    RTCPeerConnection.prototype.createAnswer = async function(...a) {
        const ans = await _origCreateAnswer.apply(this, a);
        if (ans && ans.sdp) ans.sdp = mungeSDPForOpus(ans.sdp);
        return ans;
    };

    /* ============================================================
       PARAMS — from chat app
       ============================================================ */
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = (urlParams.get('r') || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 60);
    const secretKey = (urlParams.get('k') || '').slice(0, 128);
    const role = urlParams.get('role') === 'caller' ? 'caller' : 'receiver';

    function safeBackTarget(raw) {
        if (!raw) return null;
        try {
            const u = new URL(raw, window.location.origin);
            if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
            if (u.origin !== window.location.origin) return null;
            return u.href;
        } catch { return null; }
    }
    const backUrl = safeBackTarget(urlParams.get('back'));

    /* ============================================================
       CRYPTO
       ============================================================ */
    async function sha256Hex(str) {
        const buf = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest('SHA-256', buf);
        return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    async function derivePeerId(room, r, key) {
        const hash = await sha256Hex(`${key}|${room}|${r}`);
        return 'vx_' + hash.slice(0, 32);
    }

    /* ============================================================
       STATE
       ============================================================ */
    let localStream = null;
    let activeCall = null;
    let pendingCall = null;
    const remoteAudioEl = document.getElementById('remote-audio');
    const remoteVideoEl = document.getElementById('remote-video-hidden');
    let isMuted = false;
    let isSpeakerOn = false;
    let isAutoHD = false;
    let callStarted = false;
    let isCombinedLocked = false;
    let currentPeer = null;
    let dataConnection = null;
    let wakeLock = null;
    let ringTimer = null;
    let vibrateInterval = null;
    let callTimerInterval = null;
    let audioCtx = null;
    let lastTapTime = 0;
    let isEnded = false;
    let isReturning = false;
    let earpieceDeviceId = null;
    let _statsInterval = null;
    let _watchdogInterval = null;
    let _lastBytesReceived = 0, _lastBytesSent = 0;
    let _lastLost = 0, _lastReceived = 0, _lastStatsTs = 0;
    let _statsPc = null;
    let _netQuality = 'good';
    let _iceRestartCount = 0;
    let _lastIceState = 'new';
    let myPeerId = null, targetPeerId = null;
    let _callInProgress = false;

    const isMobileDevice = /Mobi|Android/i.test(navigator.userAgent) || 'vibrate' in navigator;
    const BITRATE_SAVER = 16000;
    const BITRATE_HD    = 24000;
    const BITRATE_WEAK  = 8000;

    const AUDIO_CONSTRAINTS = {
        echoCancellation: true, noiseSuppression: true, autoGainControl: true,
        channelCount: { ideal: 1, max: 1 }, sampleRate: { ideal: 16000 }
    };

    const ICE_SERVERS = [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },
        { urls: 'turn:openrelay.metered.ca:80',  username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
    ];

    let _canSetParams = true;
    try {
        const tpc = new (window.RTCPeerConnection || window.webkitRTCPeerConnection)({ iceServers: [] });
        const ts = tpc.addTransceiver('audio', { direction: 'sendrecv' }).sender;
        const tp = ts.getParameters();
        _canSetParams = !!(tp && tp.encodings && tp.encodings.length > 0);
        tpc.close();
    } catch(e) { _canSetParams = false; }

    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

    /* ============================================================
       WAKE LOCK
       ============================================================ */
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator && !wakeLock) {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            }
        } catch(e) {}
    }

    document.addEventListener('visibilitychange', async () => {
        if (document.hidden) {
            if (_statsInterval) { clearInterval(_statsInterval); _statsInterval = null; }
            if (wakeLock) { try { await wakeLock.release(); } catch(e) {} wakeLock = null; }
        } else {
            if (callStarted && _statsPc && !_statsInterval) try { startStatsMonitor(_statsPc); } catch(e) {}
            if (callStarted && !wakeLock) try { await requestWakeLock(); } catch(e) {}
            if (callStarted && remoteAudioEl.srcObject) try { await remoteAudioEl.play(); } catch(e) {}
        }
    });

    /* ============================================================
       FULLSCREEN
       ============================================================ */
    async function toggleFullscreenAndLock() {
        isCombinedLocked = !isCombinedLocked;
        const shield = document.getElementById('touch-shield');
        const btn = document.getElementById('fs-lock-btn');
        if (isCombinedLocked) {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('portrait').catch(() => {}); } catch(e) {}
            shield.classList.add('active');
            btn.classList.add('active');
            btn.innerText = "🔓 Unlock";
        } else {
            try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e) {}
            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            shield.classList.remove('active');
            btn.classList.remove('active');
            btn.innerText = "⛶ Fullscreen & Lock";
        }
    }
    function handleShieldClick() {
        const t = Date.now();
        if ((t - lastTapTime) < 300 && (t - lastTapTime) > 0) toggleFullscreenAndLock();
        lastTapTime = t;
    }

    /* ============================================================
       EARPIECE
       ============================================================ */
    async function enumerateAndFindEarpiece() {
        let probe = null;
        try {
            if (!localStream) probe = await navigator.mediaDevices.getUserMedia({ audio: true });
            const devices = await navigator.mediaDevices.enumerateDevices();
            const ear = devices.filter(d => d.kind === 'audiooutput').find(d => {
                const l = (d.label || '').toLowerCase();
                return l.includes('earpiece') || l.includes('receiver') || l.includes('handset') || l.includes('inner');
            });
            if (ear) { earpieceDeviceId = ear.deviceId; return ear.deviceId; }
            return 'communications';
        } catch(err) { return null; }
        finally { if (probe) probe.getTracks().forEach(t => t.stop()); }
    }
    async function findSpeakerDevice() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const spk = devices.filter(d => d.kind === 'audiooutput').find(d => {
                const l = (d.label || '').toLowerCase();
                return l.includes('speaker') || l.includes('loudspeaker');
            });
            return spk ? spk.deviceId : 'default';
        } catch(e) { return 'default'; }
    }
    async function applyAudioOutputMode() {
        remoteAudioEl.volume = isSpeakerOn ? 1.0 : 0.95;
        remoteAudioEl.muted = false;
        if (typeof remoteAudioEl.setSinkId !== 'function') return;
        if (isSpeakerOn) {
            const spk = await findSpeakerDevice();
            try { await remoteAudioEl.setSinkId(spk); } catch(e) {}
            if (remoteVideoEl) try { await remoteVideoEl.setSinkId(spk); } catch(e) {}
            return;
        }
        let target = earpieceDeviceId || await enumerateAndFindEarpiece() || 'communications';
        try { await remoteAudioEl.setSinkId(target); } catch(e) {}
        if (remoteVideoEl) try { await remoteVideoEl.setSinkId(target); } catch(e) {}
    }
    function updateOutputUI() {
        const top = document.getElementById('earpiece-btn');
        const bot = document.getElementById('speaker-btn');
        if (!top || !bot) return;
        if (isSpeakerOn) {
            top.innerText = "🔊 Speaker";
            top.style.background = "#713f12"; top.style.color = "#fde047";
            top.classList.add('active');
            bot.innerText = "🎧 Earpiece";
            bot.style.background = "#1e3a8a"; bot.style.color = "#60a5fa";
            bot.classList.remove('active');
        } else {
            top.innerText = "🎧 Earpiece";
            top.style.background = "#713f12"; top.style.color = "#fde047";
            top.classList.add('active');
            bot.innerText = "🔊 Speaker";
            bot.style.background = "#1f293d"; bot.style.color = "#d1d5db";
            bot.classList.remove('active');
        }
    }
    async function toggleAudioOutput() {
        isSpeakerOn = !isSpeakerOn;
        updateOutputUI();
        try { await applyAudioOutputMode(); } catch(e) {}
        setTimeout(updateOutputUI, 50);
        if (remoteAudioEl.srcObject) try { await remoteAudioEl.play(); } catch(e) {}
    }

    /* ============================================================
       INIT
       ============================================================ */
    async function initApp() {
        if (!roomId || !secretKey) {
            document.getElementById('call-status').innerText = "Invalid link";
            return;
        }
        myPeerId = await derivePeerId(roomId, role, secretKey);
        const targetRole = role === 'caller' ? 'receiver' : 'caller';
        targetPeerId = await derivePeerId(roomId, targetRole, secretKey);

        initMediaCall();
        requestWakeLock();
    }

    if (window.crypto && window.crypto.subtle) {
        initApp().catch(e => {
            document.getElementById('call-status').innerText = "Init failed";
        });
    } else {
        document.getElementById('call-status').innerText = "HTTPS required";
    }

    /* ============================================================
       RING / VIBRATE
       ============================================================ */
    function startDeviceAlerts() {
        if (isMobileDevice) {
            if ('vibrate' in navigator) {
                vibrateInterval = setInterval(() => { try { navigator.vibrate([200, 300, 200, 800]); } catch(e){} }, 2000);
            }
        } else {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                ringTimer = setInterval(() => {
                    if (!audioCtx) return;
                    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine'; o.frequency.setValueAtTime(480, audioCtx.currentTime);
                    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(); o.stop(audioCtx.currentTime + 0.5);
                }, 2500);
            } catch(e) {}
        }
    }
    function stopAlerts() {
        if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
        if (vibrateInterval) { clearInterval(vibrateInterval); vibrateInterval = null; }
        if ('vibrate' in navigator) try { navigator.vibrate(0); } catch(e){}
    }

    /* ============================================================
       MIC
       ============================================================ */
    function initMediaCall() {
        navigator.mediaDevices.getUserMedia({ audio: AUDIO_CONSTRAINTS, video: false })
        .then(stream => {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            localStream = stream;
            if (isMuted) localStream.getAudioTracks().forEach(t => { t.enabled = false; });
            applyAudioOutputMode();
            if (!currentPeer) setupPeerConnection();
            else if (activeCall) replaceStreamInCall(stream);
        })
        .catch(err => {
            document.getElementById('call-status').innerText = "Mic permission required!";
        });
    }

    /* ============================================================
       PEER
       ============================================================ */
    function setupPeerConnection() {
        currentPeer = new Peer(myPeerId, {
            host: '0.peerjs.com', port: 443, path: '/', secure: true,
            config: {
                iceServers: ICE_SERVERS,
                iceCandidatePoolSize: 2,
                iceTransportPolicy: 'all',
                bundlePolicy: 'max-bundle',
                rtcpMuxPolicy: 'require'
            }
        });

        currentPeer.on('open', () => {
            if (role === 'caller') {
                document.getElementById('call-status').innerText = "📞 Calling...";
                _callInProgress = true;
                autoStartCall();
            } else {
                document.getElementById('call-status').innerText = "Waiting...";
            }
        });

        currentPeer.on('connection', conn => {
            if (conn.peer !== targetPeerId) { try { conn.close(); } catch(e) {} return; }
            if (dataConnection && dataConnection.open) { try { conn.close(); } catch(e) {} return; }
            dataConnection = conn;
            setupDataConnectionEvents();
        });

        currentPeer.on('call', call => {
            if (call.peer !== targetPeerId) { try { call.close(); } catch(e) {} return; }
            if (_callInProgress || activeCall || pendingCall) { try { call.close(); } catch(e) {} return; }
            pendingCall = call;
            document.getElementById('call-status').innerText = "📞 Incoming Call";
            document.getElementById('accept-btn').style.display = 'block';
            startDeviceAlerts();
        });

        currentPeer.on('disconnected', () => { try { currentPeer.reconnect(); } catch(e) {} });
        currentPeer.on('close', () => { if (!isEnded) executeCleanupAndExit(); });

        currentPeer.on('error', err => {
            const type = err && err.type;
            if (type === 'unavailable-id') {
                setTimeout(() => {
                    try { currentPeer.destroy(); } catch(e) {}
                    currentPeer = null;
                    setupPeerConnection();
                }, 3000);
            } else if (type === 'peer-unavailable') {
                if (role === 'caller') {
                    document.getElementById('call-status').innerText = "📞 Ringing...";
                    setTimeout(autoStartCall, 2000);
                }
            }
        });
    }

    /* ============================================================
       AUTO-START CALL (caller)
       ============================================================ */
    async function autoStartCall() {
        if (!_callInProgress || isEnded) return;

        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume().catch(() => {});
        } catch(e) {}

        if (!localStream) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: AUDIO_CONSTRAINTS, video: false });
                if (!currentPeer) setupPeerConnection();
            } catch(e) {
                document.getElementById('call-status').innerText = "Mic permission required!";
                return;
            }
        }

        if (!currentPeer || currentPeer.destroyed) {
            setTimeout(autoStartCall, 800);
            return;
        }

        let call;
        try { call = currentPeer.call(targetPeerId, localStream); } catch(e) { call = null; }
        if (!call) {
            setTimeout(autoStartCall, 2000);
            return;
        }
        activeCall = call;
        handleCallStream(call);
        call.on('error', e => {
            if (e && e.type === 'peer-unavailable') {
                document.getElementById('call-status').innerText = "📞 Ringing...";
                setTimeout(autoStartCall, 2000);
            }
        });
    }

    /* ============================================================
       ACCEPT (receiver)
       ============================================================ */
    async function acceptIncomingCall() {
        if (!pendingCall) return;
        _callInProgress = true;
        document.getElementById('accept-btn').style.display = 'none';
        stopAlerts();

        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
        } catch(e) {}

        if (!localStream) {
            try { localStream = await navigator.mediaDevices.getUserMedia({ audio: AUDIO_CONSTRAINTS, video: false }); }
            catch(e) { document.getElementById('call-status').innerText = "Mic permission required!"; return; }
        }

        try {
            remoteAudioEl.muted = false;
            remoteAudioEl.volume = isSpeakerOn ? 1.0 : 0.95;
            await remoteAudioEl.play().catch(() => {});
        } catch(e) {}

        try { pendingCall.answer(localStream); } catch(e) {}
        activeCall = pendingCall;
        handleCallStream(pendingCall);
        pendingCall = null;
    }

    function replaceStreamInCall(newStream) {
        if (activeCall && activeCall.peerConnection) {
            const senders = activeCall.peerConnection.getSenders();
            newStream.getTracks().forEach(track => {
                const s = senders.find(x => x.track && x.track.kind === track.kind);
                if (s) s.replaceTrack(track);
            });
        }
    }

    function setupDataConnectionEvents() {
        if (!dataConnection) return;
        dataConnection.on('data', data => {
            if (data === 'END_CALL' || (data && data.type === 'END_CALL')) executeCleanupAndExit(true);
            else if (data && data.type === 'AUTO_HD_SYNC') setAutoHDState(!!data.active, false);
        });
    }

    /* ============================================================
       BITRATE + STATS
       ============================================================ */
    function applySenderBitrate(pc, bitrate) {
        if (!_canSetParams || !pc) return;
        try {
            pc.getSenders().forEach(sender => {
                if (!sender.track || sender.track.kind !== 'audio') return;
                try {
                    const p = sender.getParameters();
                    if (!p.encodings || !p.encodings[0]) return;
                    if (p.encodings[0].maxBitrate !== bitrate) {
                        p.encodings[0].maxBitrate = bitrate;
                        try { p.encodings[0].dtx = true; } catch(e) {}
                        sender.setParameters(p).catch(() => {});
                    }
                } catch(e) {}
            });
        } catch(e) {}
    }

    function patchOpusLowBitrate(call) {
        if (!call || !call.peerConnection) return;
        applySenderBitrate(call.peerConnection, isAutoHD ? BITRATE_HD : BITRATE_SAVER);
        try { startStatsMonitor(call.peerConnection); } catch(e) {}
        try { startWatchdog(call.peerConnection); } catch(e) {}
    }

    function startStatsMonitor(pc) {
        if (_statsInterval) { clearInterval(_statsInterval); _statsInterval = null; }
        _statsPc = pc;
        _lastBytesReceived = 0; _lastBytesSent = 0;
        _lastLost = 0; _lastReceived = 0; _lastStatsTs = 0;
        const bar = document.getElementById('signal-bar');
        if (bar) bar.style.display = 'block';

        _statsInterval = setInterval(async () => {
            try {
                if (!_statsPc || _statsPc.connectionState === 'closed') return;
                if (document.hidden) return;
                const stats = await _statsPc.getStats();
                let inbound = null, outbound = null, pair = null;
                stats.forEach(r => {
                    if (r.type === 'inbound-rtp' && r.kind === 'audio') inbound = r;
                    else if (r.type === 'outbound-rtp' && r.kind === 'audio') outbound = r;
                    else if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated) pair = r;
                });
                const now = Date.now();
                if (_lastStatsTs === 0) _lastStatsTs = now;
                const dt = (now - _lastStatsTs) / 1000 || 1;

                let kbpsIn = 0, kbpsOut = 0;
                if (inbound && inbound.bytesReceived) {
                    kbpsIn = Math.round(((inbound.bytesReceived - _lastBytesReceived) * 8 / 1000) / dt);
                    _lastBytesReceived = inbound.bytesReceived;
                }
                if (outbound && outbound.bytesSent) {
                    kbpsOut = Math.round(((outbound.bytesSent - _lastBytesSent) * 8 / 1000) / dt);
                    _lastBytesSent = outbound.bytesSent;
                }

                let lossPct = 0;
                if (inbound) {
                    const lost = inbound.packetsLost || 0;
                    const recv = inbound.packetsReceived || 0;
                    const dLost = Math.max(0, lost - _lastLost);
                    const dRecv = Math.max(0, recv - _lastReceived);
                    const total = dLost + dRecv;
                    lossPct = total > 0 ? (dLost / total) * 100 : 0;
                    _lastLost = lost; _lastReceived = recv;
                }
                _lastStatsTs = now;

                let rtt = 0;
                if (pair && pair.currentRoundTripTime !== undefined) rtt = Math.round(pair.currentRoundTripTime * 1000);

                if (rtt > 400 || lossPct > 5) _netQuality = 'weak';
                else if (rtt > 200 || lossPct > 1.5) _netQuality = 'ok';
                else _netQuality = 'good';

                let icon = '▁▃▅▇', txt = 'GOOD', color = '#38ef7d';
                if (_netQuality === 'weak') { icon = '▁▁▁▁'; txt = 'WEAK'; color = '#ea0038'; }
                else if (_netQuality === 'ok') { icon = '▁▃▅▁'; txt = 'OK'; color = '#ffb74d'; }

                const si = document.getElementById('signal-icon');
                const st = document.getElementById('signal-text');
                const ss = document.getElementById('stats-text');
                if (si) { si.textContent = icon; si.style.color = color; }
                if (st) { st.textContent = txt; st.style.color = color; }
                if (ss) ss.textContent = `↓${kbpsIn} ↑${kbpsOut} kbps · ${rtt}ms`;

                if (!isAutoHD && _canSetParams) {
                    let target = BITRATE_SAVER;
                    if (_netQuality === 'weak') target = BITRATE_WEAK;
                    else if (_netQuality === 'ok') target = 12000;
                    applySenderBitrate(_statsPc, target);
                }
            } catch(e) {}
        }, 3000);
    }

    function stopStatsMonitor() {
        if (_statsInterval) { clearInterval(_statsInterval); _statsInterval = null; }
        _statsPc = null;
        const bar = document.getElementById('signal-bar');
        if (bar) bar.style.display = 'none';
    }

    function startWatchdog(pc) {
        if (_watchdogInterval) clearInterval(_watchdogInterval);
        _iceRestartCount = 0;
        _watchdogInterval = setInterval(() => {
            try {
                if (!pc || pc.connectionState === 'closed') return;
                if (pc.connectionState === 'failed') {
                    if (_iceRestartCount < 3) { _iceRestartCount++; try { pc.restartIce(); } catch(e) {} }
                } else if (pc.connectionState === 'connected') _iceRestartCount = 0;
            } catch(e) {}
        }, 4000);
    }
    function stopWatchdog() {
        if (_watchdogInterval) { clearInterval(_watchdogInterval); _watchdogInterval = null; }
        _iceRestartCount = 0;
    }

    /* ============================================================
       CALL STREAM
       ============================================================ */
    function handleCallStream(call) {
        stopAlerts();
        patchOpusLowBitrate(call);

        try {
            if (call.peerConnection) {
                const pc = call.peerConnection;
                pc.oniceconnectionstatechange = () => {
                    const s = pc.iceConnectionState;
                    if (s !== _lastIceState) _lastIceState = s;
                    if (s === 'disconnected' || s === 'failed') document.getElementById('call-status').innerText = "Reconnecting...";
                    else if (s === 'connected' || s === 'completed') document.getElementById('call-status').innerText = "🔒 Connected";
                };
            }
        } catch(e) {}

        call.on('stream', async remoteStream => {
            document.getElementById('call-status').innerText = "🔒 Connected";
            document.getElementById('call-timer').style.display = 'block';
            document.getElementById('call-controls').classList.add('active');
            document.getElementById('fs-lock-btn').style.display = 'block';
            document.getElementById('end-btn').style.display = 'block';
            document.getElementById('accept-btn').style.display = 'none';
            startCallTimer();
            callStarted = true;

            remoteAudioEl.srcObject = remoteStream;
            remoteAudioEl.muted = false;
            if (remoteVideoEl) {
                remoteVideoEl.srcObject = remoteStream;
                remoteVideoEl.muted = true;
            }

            await applyAudioOutputMode();

            try { await remoteAudioEl.play(); }
            catch(e) {
                const retry = () => {
                    remoteAudioEl.play().catch(() => {});
                    document.removeEventListener('click', retry);
                    document.removeEventListener('touchstart', retry);
                };
                document.addEventListener('click', retry, { once: true });
                document.addEventListener('touchstart', retry, { once: true });
            }

            if (remoteVideoEl) remoteVideoEl.play().catch(() => {});
        });

        call.on('close', () => executeCleanupAndExit());
        call.on('error', () => executeCleanupAndExit());
    }

    /* ============================================================
       AUTO HD
       ============================================================ */
    function toggleAutoHD() { setAutoHDState(!isAutoHD, true); }
    function setAutoHDState(enabled, broadcast = true) {
        isAutoHD = !!enabled;
        const btn = document.getElementById('auto-hd-btn');
        if (btn) {
            btn.classList.toggle('active', isAutoHD);
            btn.innerText = isAutoHD ? "⚡ Auto HD ON" : "⚡ Data Saver";
        }
        if (activeCall && activeCall.peerConnection) {
            applySenderBitrate(activeCall.peerConnection, isAutoHD ? BITRATE_HD : BITRATE_SAVER);
        }
        if (broadcast && dataConnection && dataConnection.open) {
            try { dataConnection.send({ type: 'AUTO_HD_SYNC', active: isAutoHD }); } catch(e) {}
        }
    }

    /* ============================================================
       TIMER
       ============================================================ */
    let _callStartTs = 0;
    function startCallTimer() {
        if (callTimerInterval) return;
        _callStartTs = Date.now();
        callTimerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - _callStartTs) / 1000);
            const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const s = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('call-timer').innerText = `${m}:${s}`;
        }, 1000);
    }

    function toggleMute() {
        if (!localStream) return;
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(t => { t.enabled = !isMuted; });
        const b = document.getElementById('mute-btn');
        b.classList.toggle('active', isMuted);
        b.innerText = isMuted ? "🔇 Unmute" : "🎙️ Mute";
    }

    function endCallAndClose() {
        try { if (dataConnection && dataConnection.open) dataConnection.send({ type: 'END_CALL' }); } catch(e) {}
        executeCleanupAndExit(false);
    }

    window.addEventListener('beforeunload', () => {
        try { if (dataConnection && dataConnection.open) dataConnection.send({ type: 'END_CALL' }); } catch(e) {}
    });

    /* ============================================================
       CLEANUP + RETURN
       ============================================================ */
    function executeCleanupAndExit(endedByRemote = false) {
        if (isEnded || isReturning) return;
        isEnded = true; isReturning = true;

        stopAlerts();
        try { stopStatsMonitor(); } catch(e) {}
        try { stopWatchdog(); } catch(e) {}
        if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
        try { if (wakeLock !== null) wakeLock.release().catch(() => {}); } catch(e) {}
        wakeLock = null;
        try { if (pendingCall) pendingCall.close(); } catch(e) {}
        try { if (activeCall) activeCall.close(); } catch(e) {}
        try { if (localStream) localStream.getTracks().forEach(t => t.stop()); } catch(e) {}
        try {
            remoteAudioEl.pause(); remoteAudioEl.srcObject = null;
            if (remoteVideoEl) { remoteVideoEl.pause(); remoteVideoEl.srcObject = null; }
        } catch(e) {}
        try { if (dataConnection) dataConnection.close(); } catch(e) {}
        try { if (currentPeer && !currentPeer.destroyed) currentPeer.destroy(); } catch(e) {}

        try {
            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
        } catch(e) {}

        setTimeout(returnToChat, 400);
    }

    function returnToChat() {
        try {
            if (backUrl) { window.location.replace(backUrl); return; }
            if (document.referrer && document.referrer !== '') { window.location.replace(document.referrer); return; }
            if (window.history.length > 1) { window.history.back(); return; }
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#86efac;font-family:monospace;flex-direction:column;"><div style="font-size:48px;">✅</div><div style="font-size:14px;margin-top:10px;">કોલ પૂરો</div></div>';
        } catch(e) {
            try { window.close(); } catch(_) {}
        }
    }
    </script>
