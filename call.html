<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Secure Node - Responsive Video Call</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { background: #07090e; color: #00ff66; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; overflow: hidden; position: relative; }
        
        .box { background: #0b0e14; border: 1px solid #1f293d; padding: 12px; border-radius: 16px; width: 95%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; height: 96vh; max-height: 700px; }
        
        /* Fullscreen Video Mode */
        body.video-fullscreen { background: #000; }
        body.video-fullscreen .box { max-width: 100%; width: 100%; height: 100vh; border: none; border-radius: 0; padding: 8px; background: #07090e; max-height: 100vh; justify-content: space-between; }
        body.video-fullscreen .hide-in-video { display: none !important; }
        
        .video-container { display: flex; gap: 6px; justify-content: center; align-items: center; margin: 2px 0; width: 100%; flex-wrap: wrap; }
        video { width: 48%; max-height: 140px; background: #000; border-radius: 8px; object-fit: cover; border: 1px solid #1f293d; display: none; }
        video.active { display: block; }

        body.video-fullscreen .video-container { height: 56vh; flex-direction: column; gap: 4px; align-content: center; justify-content: center; margin-bottom: 0; }
        
        /* મોબાઈલ માટે વિડિયો ફ્રેમ યથાવત રાખી બટનો ઉપર ખેંચવા માટે */
        @media (max-width: 768px) {
            body.video-fullscreen video.active { width: 92% !important; height: 38vh !important; max-height: none; }
        }
        @media (min-width: 769px) {
            body.video-fullscreen video.active { width: 48%; height: 100%; max-height: none; }
        }

        h3 { color: #3b82f6; margin-bottom: 2px; font-size: 14px; letter-spacing: 1px; }
        p { font-size: 10px; color: #9ca3af; margin-bottom: 2px; }
        .status { font-size: 12px; margin: 2px 0; color: #ffb74d; font-weight: bold; }
        .timer { font-size: 14px; color: #60a5fa; margin-bottom: 2px; font-weight: bold; letter-spacing: 2px; }

        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .ctrl-btn { background: #1f293d; color: #d1d5db; border: none; padding: 10px 4px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; transition: 0.2s; outline: none; }
        .ctrl-btn.active { background: #1e3a8a; color: #60a5fa; border: 1px solid #3b82f6; }
        
        .utility-btn { background: #14532d; color: #86efac; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; margin-bottom: 6px; outline: none; }
        .utility-btn.active { background: #713f12; color: #fde047; }

        /* Video Call Bottom Controls - ખાલી જગ્યા દૂર કરી બટનો ઉપર સેટ કર્યા છે */
        .video-controls { display: none; flex-direction: column; gap: 6px; width: 100%; margin-top: auto; padding-bottom: 2px; }
        .video-buttons-row { display: flex; gap: 8px; width: 100%; }
        .video-ctrl-btn { background: #1f293d; color: #d1d5db; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 12px; flex: 1; outline: none; }
        .video-ctrl-btn.active { background: #1e3a8a; color: #60a5fa; border: 1px solid #3b82f6; }

        .end-btn { background: #7f1d1d; color: #fca5a5; border: none; padding: 13px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; outline: none; }
        .end-btn:hover { background: #991b1b; }

        #touch-shield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; color: #fde047; font-size: 14px; font-weight: bold; }
        #touch-shield.active { display: flex; z-index: 99; }
    </style>
</head>
<body>
    <div id="touch-shield" onclick="handleShieldClick()">🔒 Fullscreen & Touch Locked<br><span style="font-size:11px; color:#9ca3af; font-weight:normal; display:block; margin-top:6px;">(Double tap anywhere to unlock)</span></div>
    
    <div class="box">
        <div class="hide-in-video">
            <h3>SECURE_NODE_AV</h3>
            <p id="mode-text">Data Saver Mode (2G Optimized)</p>
        </div>
        
        <div>
            <div id="call-status" class="status">Initializing channel...</div>
            <div id="call-timer" class="timer" style="display:none;">00:00</div>
        </div>
        
        <!-- Video elements -->
        <div class="video-container">
            <video id="local-video" autoplay playsinline muted></video>
            <video id="remote-video" autoplay playsinline></video>
        </div>
        <audio id="remote-audio" autoplay playsinline></audio>

        <button id="fs-lock-btn" class="utility-btn hide-in-video" onclick="toggleFullscreenAndLock()" style="display:none;">⛶ Fullscreen & Lock</button>

        <div class="controls-grid hide-in-video">
            <button id="mute-btn" class="ctrl-btn" onclick="toggleMute()">🎙️ Mute</button>
            <button id="speaker-btn" class="ctrl-btn" onclick="toggleSpeaker()">🔊 Speaker</button>
            <button id="video-btn" class="ctrl-btn" onclick="toggleVideoMode()">📹 Video On</button>
            <button id="hd-btn" class="ctrl-btn" onclick="toggleHDMode()">⚡ HD Off</button>
        </div>

        <!-- Video Call Controls -->
        <div id="video-active-controls" class="video-controls">
            <div class="video-buttons-row">
                <button id="video-mute-btn" class="video-ctrl-btn" onclick="toggleMute()">🎙️ Mute</button>
                <button class="video-ctrl-btn" onclick="switchCamera()">🔄 Flip Cam</button>
            </div>
            <button class="end-btn" onclick="endCallAndClose()">🔴 END CALL</button>
        </div>

        <button id="normal-end-btn" class="end-btn hide-in-video" onclick="endCallAndClose()">🔴 END CALL</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const role = urlParams.get('role');
        const redirectUrl = urlParams.get('back');

        window.addEventListener('pageshow', function() {
            if (window.history.replaceState) {
                window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
            }
        });

        let localStream = null;
        let activeCall = null;
        let remoteAudioEl = document.getElementById('remote-audio');
        let localVideoEl = document.getElementById('local-video');
        let remoteVideoEl = document.getElementById('remote-video');

        let isMuted = false;
        let isSpeakerOn = false;
        let isVideoActive = false;
        let isHDActive = false;
        let currentFacingMode = 'user';
        let isCombinedLocked = false;
        let currentPeer = null;
        let dataConnection = null;
        let wakeLock = null;
        let ringTimer = null;
        let vibrateInterval = null;
        let callTimerInterval = null;
        let callSeconds = 0;
        let audioCtx = null;
        let lastTapTime = 0;
        let isEnded = false;
        let isReturning = false;

        const isMobileDevice = /Mobi|Android/i.test(navigator.userAgent) || 'vibrate' in navigator;

        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }

        function toggleFullscreenAndLock() {
            isCombinedLocked = !isCombinedLocked;
            const shield = document.getElementById('touch-shield');
            const btn = document.getElementById('fs-lock-btn');

            if (isCombinedLocked) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                shield.classList.add('active');
                btn.classList.add('active');
                btn.innerText = "🔓 Unlock Screen";
            } else {
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                shield.classList.remove('active');
                btn.classList.remove('active');
                btn.innerText = "⛶ Fullscreen & Lock";
            }
        }

        function handleShieldClick() {
            const currentTime = new Date().getTime();
            if ((currentTime - lastTapTime) < 300 && (currentTime - lastTapTime) > 0) toggleFullscreenAndLock();
            lastTapTime = currentTime;
        }

        if (!roomId || !role) {
            document.getElementById('call-status').innerText = "Error: Invalid Room/Role";
        } else {
            startDeviceAlerts();
            initMediaCall(false);
            requestWakeLock();
        }

        function startDeviceAlerts() {
            if (isMobileDevice) {
                if ('vibrate' in navigator) {
                    vibrateInterval = setInterval(() => {
                        try { navigator.vibrate([200, 300, 200, 800]); } catch(e){}
                    }, 2000);
                }
            } else {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    ringTimer = setInterval(() => {
                        if (!audioCtx) return;
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(480, audioCtx.currentTime);
                        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                    }, 2500);
                } catch(e) {}
            }
        }

        function stopAlerts() {
            if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
            if (vibrateInterval) { clearInterval(vibrateInterval); vibrateInterval = null; }
            if ('vibrate' in navigator) { try { navigator.vibrate(0); } catch(e){} }
        }

        function initMediaCall(enableVideo) {
            const constraints = {
                audio: { 
                    echoCancellation: true, 
                    noiseSuppression: true, 
                    autoGainControl: true,
                    sampleRate: isHDActive ? 48000 : 16000 
                },
                video: enableVideo ? { 
                    width: { ideal: 640 }, 
                    height: { ideal: 480 },
                    facingMode: currentFacingMode 
                } : false
            };

            navigator.mediaDevices.getUserMedia(constraints)
            .then(stream => {
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                localStream = stream;

                if (enableVideo) {
                    localVideoEl.srcObject = stream;
                    localVideoEl.classList.add('active');
                    document.body.classList.add('video-fullscreen');
                    document.getElementById('video-active-controls').style.display = 'flex';
                    document.getElementById('normal-end-btn').style.display = 'none';
                } else {
                    localVideoEl.classList.remove('active');
                    localVideoEl.srcObject = null;
                    if (!remoteVideoEl.classList.contains('active')) {
                        document.body.classList.remove('video-fullscreen');
                        document.getElementById('video-active-controls').style.display = 'none';
                        document.getElementById('normal-end-btn').style.display = 'block';
                    }
                }

                if (!currentPeer) {
                    setupPeerConnection();
                } else if (activeCall) {
                    replaceStreamInCall(stream);
                }
            })
            .catch(() => {
                stopAlerts();
                document.getElementById('call-status').innerText = "Camera/Mic permission required!";
                isVideoActive = false;
                document.getElementById('video-btn').classList.remove('active');
                document.getElementById('video-btn').innerText = "📹 Video On";
            });
        }

        function setupPeerConnection() {
            const peerId = `secure_av33_${roomId}_${role}`;
            const targetRole = role === 'caller' ? 'receiver' : 'caller';
            const targetPeerId = `secure_av33_${roomId}_${targetRole}`;

            currentPeer = new Peer(peerId, {
                host: '0.peerjs.com', port: 443, path: '/', secure: true,
                config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] }
            });

            currentPeer.on('open', () => {
                document.getElementById('call-status').innerText = role === 'caller' ? "Calling..." : "Incoming Call...";
                setTimeout(() => tryConnect(targetPeerId), 800);
            });

            currentPeer.on('connection', (conn) => {
                dataConnection = conn;
                setupDataConnectionEvents();
            });

            currentPeer.on('call', (call) => {
                activeCall = call;
                stopAlerts();
                call.answer(localStream);
                handleCallStream(call);
            });

            currentPeer.on('error', () => {
                document.getElementById('call-status').innerText = "Connecting...";
            });
        }

        function tryConnect(targetPeerId) {
            if (!currentPeer || currentPeer.destroyed) return;
            dataConnection = currentPeer.connect(targetPeerId);
            setupDataConnectionEvents();

            const call = currentPeer.call(targetPeerId, localStream);
            if (call) {
                activeCall = call;
                handleCallStream(call);
            } else {
                setTimeout(() => tryConnect(targetPeerId), 2000);
            }
        }

        function replaceStreamInCall(newStream) {
            if (activeCall && activeCall.peerConnection) {
                const senders = activeCall.peerConnection.getSenders();
                newStream.getTracks().forEach(track => {
                    const sender = senders.find(s => s.track && s.track.kind === track.kind);
                    if (sender) sender.replaceTrack(track);
                });
            }
        }

        function setupDataConnectionEvents() {
            if (!dataConnection) return;
            dataConnection.on('data', (data) => {
                if (data === 'END_CALL' || (data && data.type === 'END_CALL')) {
                    executeCleanupAndExit(true);
                } else if (data && data.type === 'HD_SYNC') {
                    applyRemoteHDState(data.active);
                } else if (data && data.type === 'VIDEO_SYNC') {
                    if (data.active) {
                        if (!isVideoActive) {
                            isVideoActive = true;
                            document.getElementById('video-btn').classList.add('active');
                            document.getElementById('video-btn').innerText = "📹 Video Off";
                            initMediaCall(true);
                        }
                        document.getElementById('call-status').innerText = "Partner turned on Video 📹";
                    } else {
                        document.getElementById('call-status').innerText = "Encrypted Active Call 🔒";
                    }
                }
            });
        }

        function handleCallStream(call) {
            stopAlerts();
            
            call.on('stream', (remoteStream) => {
                document.getElementById('call-status').innerText = "Encrypted Active Call 🔒";
                document.getElementById('call-timer').style.display = 'block';
                document.getElementById('fs-lock-btn').style.display = 'block';
                startCallTimer();

                remoteVideoEl.srcObject = remoteStream;
                if (remoteStream.getVideoTracks().length > 0) {
                    remoteVideoEl.classList.add('active');
                    document.body.classList.add('video-fullscreen');
                    document.getElementById('video-active-controls').style.display = 'flex';
                    document.getElementById('normal-end-btn').style.display = 'none';
                }

                remoteAudioEl.srcObject = remoteStream;
                remoteAudioEl.volume = 0.7; 
                remoteAudioEl.play().catch(() => {});
            });

            call.on('close', () => {
                executeCleanupAndExit();
            });
        }

        function toggleVideoMode() {
            isVideoActive = !isVideoActive;
            const videoBtn = document.getElementById('video-btn');
            
            if (isVideoActive) {
                videoBtn.classList.add('active');
                videoBtn.innerText = "📹 Video Off";
            } else {
                videoBtn.classList.remove('active');
                videoBtn.innerText = "📹 Video On";
                if (!remoteVideoEl.classList.contains('active')) {
                    document.body.classList.remove('video-fullscreen');
                    document.getElementById('video-active-controls').style.display = 'none';
                    document.getElementById('normal-end-btn').style.display = 'block';
                }
            }

            initMediaCall(isVideoActive);
            if (dataConnection && dataConnection.open) {
                dataConnection.send({ type: 'VIDEO_SYNC', active: isVideoActive });
            }
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            if (isVideoActive) {
                initMediaCall(true);
            }
        }

        function toggleSpeaker() {
            isSpeakerOn = !isSpeakerOn;
            const speakerBtn = document.getElementById('speaker-btn');
            remoteAudioEl.volume = isSpeakerOn ? 1.0 : 0.7;

            if (isSpeakerOn) {
                speakerBtn.classList.add('active');
                speakerBtn.innerText = "🔊 Speaker ON";
            } else {
                speakerBtn.classList.remove('active');
                speakerBtn.innerText = "🔊 Speaker";
            }
        }

        function toggleHDMode() {
            isHDActive = !isHDActive;
            updateHDUIState();
            initMediaCall(isVideoActive);
            if (dataConnection && dataConnection.open) {
                dataConnection.send({ type: 'HD_SYNC', active: isHDActive });
            }
        }

        function applyRemoteHDState(status) {
            if (isHDActive === status) return;
            isHDActive = status;
            updateHDUIState();
        }

        function updateHDUIState() {
            const hdBtn = document.getElementById('hd-btn');
            const modeText = document.getElementById('mode-text');

            if (isHDActive) {
                hdBtn.classList.add('active');
                hdBtn.innerText = "⚡ HD ON";
                modeText.innerText = "HD Mode Active (High Quality)";
            } else {
                hdBtn.classList.remove('active');
                hdBtn.innerText = "⚡ HD Off";
                modeText.innerText = "Data Saver Mode (2G Optimized)";
            }
        }

        function startCallTimer() {
            if (callTimerInterval) return;
            callTimerInterval = setInterval(() => {
                callSeconds++;
                let mins = Math.floor(callSeconds / 60).toString().padStart(2, '0');
                let secs = (callSeconds % 60).toString().padStart(2, '0');
                document.getElementById('call-timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => { track.enabled = !isMuted; });
            
            const muteBtn = document.getElementById('mute-btn');
            const videoMuteBtn = document.getElementById('video-mute-btn');
            
            muteBtn.classList.toggle('active', isMuted);
            muteBtn.innerText = isMuted ? "🔇 Unmute" : "🎙️ Mute";
            
            if (videoMuteBtn) {
                videoMuteBtn.classList.toggle('active', isMuted);
                videoMuteBtn.innerText = isMuted ? "🔇 Unmute" : "🎙️ Mute";
            }
        }

        function endCallAndClose() {
            try {
                if (dataConnection && dataConnection.open) {
                    dataConnection.send({ type: 'END_CALL' });
                }
            } catch (e) {}

            executeCleanupAndExit(false);
        }

        function executeCleanupAndExit(endedByRemote = false) {
            if (isEnded || isReturning) return;
            isEnded = true;
            isReturning = true;

            stopAlerts();
            if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }

            try { if (wakeLock !== null) wakeLock.release().catch(() => {}); } catch(e) {}
            wakeLock = null;

            try { if (activeCall) activeCall.close(); } catch(e) {}
            try { if (localStream) localStream.getTracks().forEach(track => track.stop()); } catch(e) {}

            try {
                remoteAudioEl.pause();
                remoteAudioEl.srcObject = null;
            } catch(e) {}

            try { if (dataConnection) dataConnection.close(); } catch(e) {}
            try { if (currentPeer && !currentPeer.destroyed) currentPeer.destroy(); } catch(e) {}

            document.getElementById('call-status').innerText = 
                endedByRemote ? "Call ended by other user. Returning..." : "Call terminated. Returning...";
            
            try {
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            } catch(e) {}

            setTimeout(() => {
                if (redirectUrl) {
                    window.location.replace(redirectUrl);
                } else if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.close();
                }
            }, 300);
        }
    </script>
</body>
</html>
