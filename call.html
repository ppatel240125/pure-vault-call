<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Secure Voice Call</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
html, body { touch-action: manipulation; overscroll-behavior: none; }
body { background: #07090e; color: #00ff66; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; overflow: hidden; }
.box { background: #0b0e14; border: 1px solid #1f293d; padding: 20px; border-radius: 16px; width: 92%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
h3 { color: #3b82f6; margin: 0 0 4px; font-size: 14px; letter-spacing: 1px; }
p { font-size: 10px; color: #9ca3af; margin: 0 0 8px; }
.status { font-size: 12px; margin: 4px 0; color: #ffb74d; font-weight: bold; }
.timer { font-size: 14px; color: #60a5fa; margin: 4px 0; font-weight: bold; letter-spacing: 2px; }
#signal-bar { display: none; font-size: 11px; margin: 4px 0 8px; color: #9ca3af; }
#signal-icon { font-weight: bold; }
#stats-text { margin-left: 6px; opacity: 0.7; font-size: 10px; }
.controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.ctrl-btn { background: #1f293d; color: #d1d5db; border: none; padding: 10px 4px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; outline: none; transition: 0.2s; }
.ctrl-btn.active { background: #1e3a8a; color: #60a5fa; border: 1px solid #3b82f6; }
#auto-hd-btn { grid-column: 1 / -1; padding: 14px 8px; min-height: 50px; font-size: 14px; }
.utility-btn { background: #713f12; color: #fde047; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; margin-bottom: 6px; outline: none; }
.end-btn { background: #7f1d1d; color: #fca5a5; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 4px; outline: none; }
#permission-banner { background: #7f1d1d; color: #fca5a5; font-size: 11px; padding: 10px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; display: none; font-weight: bold; }
#permission-banner.active { display: block; animation: pulse-banner 1.2s infinite; }
@keyframes pulse-banner {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
    50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
}
#audio-fix-banner { background: #1e3a8a; color: #93c5fd; font-size: 11px; padding: 6px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; display: none; }
#debug-panel { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.9); color: #00ff66; font-size: 9px; padding: 4px; max-height: 100px; overflow-y: auto; z-index: 9999; display: none; font-family: monospace; }
#debug-panel.active { display: block; }
</style>
</head>
<body>
<div class="box">
    <h3>SECURE_NODE_VOICE</h3>
    <p id="mode-text">Data Saver · 12kbps</p>
    <div id="permission-banner">⚠️ Tap to grant microphone</div>
    <div id="call-status" class="status">Initializing...</div>
    <div id="call-timer" class="timer" style="display:none;">00:00</div>
    <div id="signal-bar">
        <span id="signal-icon">▁▃▅▇</span>
        <span id="stats-text"></span>
    </div>
    <div id="audio-fix-banner" onclick="forceUnlockAudio(event)">🔊 No sound? Tap here</div>
    <audio id="remote-audio" autoplay playsinline></audio>
    <button class="utility-btn" onclick="toggleAudioOutput()" id="output-btn">🎧 Earpiece</button>
    <div class="controls-grid">
        <button id="mute-btn" class="ctrl-btn" onclick="toggleMute()">🎙️ Mute</button>
        <button id="speaker-btn" class="ctrl-btn" onclick="toggleAudioOutput()">🔊 Speaker</button>
        <button id="auto-hd-btn" class="ctrl-btn" onclick="toggleAutoHD()">🪶 Data Saver</button>
    </div>
    <button class="end-btn" onclick="endCallAndClose()">🔴 END CALL</button>
</div>
<div id="debug-panel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>
/* ============================================================
   PARAMS
   ============================================================ */
const P = new URLSearchParams(location.search);
const roomId = (P.get('room') || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 40);
const role = P.get('role') === 'caller' ? 'caller' : 'receiver';
const debugMode = P.get('debug') === '1';

let redirectUrl = null;
try {
    const raw = P.get('back');
    if (raw) {
        const u = new URL(raw, location.origin);
        if ((u.protocol === 'http:' || u.protocol === 'https:') && u.origin === location.origin) {
            redirectUrl = u.href;
        }
    }
} catch(e) {}

history.replaceState(null, document.title, location.pathname + location.search);

/* ============================================================
   STATE
   ============================================================ */
let localStream = null, activeCall = null, dataConn = null, peer = null;
let isMuted = false, isSpeakerOn = false, isAutoHD = false;
let callStarted = false, isEnded = false;
let vibrateTimer = null, ringTimer = null, callTimer = null, statsTimer = null;
let callSeconds = 0, connectTimeout = null, incomingTimeout = null, retryCount = 0;
let audioCtx = null, _canSetParams = true, _netQuality = 'good';
let _pc = null, _lastRx = 0, _lastTx = 0, _lastTs = 0;
let wakeLock = null;
let pendingFlow = null;
let callInitiated = false;

const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

const B_SAVER = 12000, B_HD = 16000, B_WEAK = 10000;

const remoteAudio = document.getElementById('remote-audio');

/* ============================================================
   LOG (always to console + panel if debug)
   ============================================================ */
function log(msg) {
    console.log('[VCALL] ' + msg);
    if (debugMode) {
        const p = document.getElementById('debug-panel');
        p.classList.add('active');
        p.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + p.innerHTML;
    }
}

/* ============================================================
   SDP MUNGING (unchanged — data saver)
   ============================================================ */
const _origOffer = RTCPeerConnection.prototype.createOffer;
const _origAnswer = RTCPeerConnection.prototype.createAnswer;

function mungeSDP(sdp) {
    if (!sdp || !/opus\/48000/i.test(sdp)) return sdp;
    const lines = sdp.split('\r\n');
    let pt = null;
    for (const l of lines) {
        const m = l.match(/^a=rtpmap:(\d+)\s+opus\/48000/i);
        if (m) { pt = m[1]; break; }
    }
    if (!pt) return sdp;

    let bitrate = isAutoHD ? B_HD : B_SAVER;
    if (_netQuality === 'weak') bitrate = B_WEAK;

    const out = [];
    for (const l of lines) {
        const pre = 'a=fmtp:' + pt + ' ';
        if (l.startsWith(pre)) {
            let parts = l.substring(pre.length).split(';').map(s => s.trim()).filter(Boolean);
            const set = (k, v) => {
                const i = parts.findIndex(p => p.startsWith(k + '='));
                if (i >= 0) parts[i] = k + '=' + v; else parts.push(k + '=' + v);
            };
            set('useinbandfec', '1');
            set('usedtx', '1');
            set('stereo', '0');
            set('sprop-stereo', '0');
            set('maxaveragebitrate', String(bitrate));
            set('maxplaybackrate', '12000');
            set('sprop-maxcapturerate', '12000');
            set('minptime', '40');
            set('ptime', '40');
            set('cbr', '0');
            set('application', 'voip');
            out.push(pre + parts.join(';'));
        } else out.push(l);
    }
    return out.join('\r\n');
}

RTCPeerConnection.prototype.createOffer = async function(...a) {
    const o = await _origOffer.apply(this, a);
    if (o && o.sdp) o.sdp = mungeSDP(o.sdp);
    return o;
};
RTCPeerConnection.prototype.createAnswer = async function(...a) {
    const x = await _origAnswer.apply(this, a);
    if (x && x.sdp) x.sdp = mungeSDP(x.sdp);
    return x;
};

/* ============================================================
   SINK SUPPORT
   ============================================================ */
const SINK_SUPPORTED = typeof remoteAudio.setSinkId === 'function';
const CTX_SINK_SUPPORTED = (typeof AudioContext !== 'undefined') && ('setSinkId' in AudioContext.prototype);
let _callAudioCtx = null;
let _callSourceNode = null;
log('HTMLMedia.setSinkId=' + SINK_SUPPORTED + ' | AudioContext.setSinkId=' + CTX_SINK_SUPPORTED);

/* ============================================================
   INIT
   ============================================================ */
if (!roomId || !role) {
    document.getElementById('call-status').innerText = "Error: Invalid Room/Role";
} else {
    startInit();
}

function startInit() {
    log('startInit room=' + roomId + ' role=' + role);
    updateAutoHDUI();
    setupPeer();
    requestWakeLock();
}

/* ============================================================
   MIC PERMISSION
   ============================================================ */
let micRetry = 0;
async function initMic() {
    if (localStream && localStream.active) {
        log('Mic already active');
        return localStream;
    }
    
    log('Requesting mic...');
    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
                channelCount: 1,
                sampleRate: 12000
            },
            video: false
        });
        
        document.getElementById('permission-banner').classList.remove('active');
        micRetry = 0;
        
        const track = localStream.getAudioTracks()[0];
        if (track) {
            try { track.contentHint = 'speech'; } catch(e) {}
        }
        
        if (isMuted && track) track.enabled = false;
        log('✅ Mic ready');
        return localStream;
    } catch(err) {
        log('❌ Mic err: ' + err.name + ' — ' + err.message);
        const banner = document.getElementById('permission-banner');
        banner.classList.add('active');
        if (err.name === 'NotAllowedError') {
            banner.innerText = "⛔ Mic blocked. Click 🔒 → Allow → Tap here";
        } else {
            banner.innerText = "⚠️ Mic error. Tap to retry";
        }
        return null;
    }
}

function requestMicPermission() {
    micRetry = 0;
    if (pendingFlow) {
        if (pendingFlow.type === 'call') beginCallFlow(pendingFlow.targetId);
        else if (pendingFlow.type === 'accept') acceptCallFlow(pendingFlow.call);
    } else {
        initMic();
    }
}

/* ============================================================
   CALL FLOWS
   ============================================================ */
async function beginCallFlow(targetId) {
    log('🎬 beginCallFlow');
    pendingFlow = { type: 'call', targetId };
    clearTimeout(connectTimeout);
    
    const banner = document.getElementById('permission-banner');
    banner.classList.remove('active');
    document.getElementById('call-status').innerText = "Requesting mic...";

    const mic = await initMic();
    if (!mic) {
        banner.innerText = "⚠️ Mic error. Tap to retry";
        banner.onclick = () => requestMicPermission();
        banner.classList.add('active');
        return;
    }

    // Default: earpiece (user can toggle to speaker)
    isSpeakerOn = false;
    updateOutputUI();
    log('🎧 Default output: Earpiece');

    // Restart connect timeout
    clearTimeout(connectTimeout);
    connectTimeout = setTimeout(() => {
        if (!callStarted && !isEnded) {
            stopAlerts();
            document.getElementById('call-status').innerText = "No answer. Tap END.";
        }
    }, 60000);

    document.getElementById('call-status').innerText = "Calling...";
    startAlerts();  // caller feedback
    startCall(targetId);
}

async function acceptCallFlow(call) {
    log('🎬 acceptCallFlow');
    pendingFlow = { type: 'accept', call };
    stopAlerts();
    clearTimeout(incomingTimeout);

    const banner = document.getElementById('permission-banner');
    banner.classList.remove('active');
    document.getElementById('call-status').innerText = "Requesting mic...";

    const mic = await initMic();
    if (!mic) {
        banner.innerText = "⚠️ Mic error. Tap to retry";
        banner.onclick = () => requestMicPermission();
        banner.classList.add('active');
        return;
    }

    isSpeakerOn = false;
    updateOutputUI();
    log('🎧 Default output: Earpiece');

    document.getElementById('call-status').innerText = "Answering...";
    log('📞 call.answer()');
    try {
        call.answer(localStream);
        log('✅ Answer sent');
        handleStream(call);
    } catch(e) {
        log('❌ Answer err: ' + (e.message || e));
        cleanup(true);
    }
}

/* ============================================================
   ALERTS (ringing / vibrate)
   ============================================================ */
function startAlerts() {
    stopAlerts();
    if (isMobile && 'vibrate' in navigator) {
        vibrateTimer = setInterval(() => {
            if (callStarted || isEnded) { stopAlerts(); return; }
            try { navigator.vibrate([200, 300, 200, 800]); } catch(e){}
        }, 2000);
    } else {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            ringTimer = setInterval(() => {
                if (callStarted || isEnded) { stopAlerts(); return; }
                if (!audioCtx) return;
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.frequency.value = 480;
                g.gain.value = 0.08;
                o.connect(g).connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + 0.3);
            }, 2500);
        } catch(e) {}
    }
}

function stopAlerts() {
    if (vibrateTimer) { clearInterval(vibrateTimer); vibrateTimer = null; }
    if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
    if ('vibrate' in navigator) try { navigator.vibrate(0); } catch(e){}
}

/* ============================================================
   PEER SETUP
   ============================================================ */
const ICE = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turns:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
];

function setupPeer() {
    const myId = `secure_av25_${roomId}_${role}`;
    const targetId = `secure_av25_${roomId}_${role === 'caller' ? 'receiver' : 'caller'}`;

    if (peer && !peer.destroyed) try { peer.destroy(); } catch(e) {}

    peer = new Peer(myId, {
        host: '0.peerjs.com', port: 443, path: '/', secure: true,
        config: {
            iceServers: ICE,
            bundlePolicy: 'max-bundle',
            rtcpMuxPolicy: 'require'
        },
        debug: 1
    });

    peer.on('open', (id) => {
        log('✅ Peer open: ' + id);
        const banner = document.getElementById('permission-banner');

        if (role === 'caller') {
            document.getElementById('call-status').innerText = "Ready. Tap to Call.";
            banner.innerText = "📞 Tap to Call";
            banner.classList.add('active');
            banner.onclick = () => beginCallFlow(targetId);
        } else {
            document.getElementById('call-status').innerText = "Waiting for call...";
        }
    });

    peer.on('connection', c => {
        log('🔗 Data conn from ' + c.peer);
        dataConn = c;
        setupDataConn();
    });

    peer.on('call', call => {
        log('📞 Incoming call from ' + call.peer);
        activeCall = call;
        clearTimeout(connectTimeout);

        const banner = document.getElementById('permission-banner');
        document.getElementById('call-status').innerText = "Incoming Call 📞";
        banner.innerText = "📞 Tap to Accept";
        banner.classList.add('active');
        banner.onclick = () => acceptCallFlow(call);

        startAlerts();  // ring now

        clearTimeout(incomingTimeout);
        incomingTimeout = setTimeout(() => {
            if (!callStarted && activeCall === call && !isEnded) {
                log('⏱️ Incoming timeout — closing');
                try { call.close(); } catch(e) {}
                if (!isEnded) cleanup(true);
            }
        }, 60000);
    });

    peer.on('disconnected', () => {
        log('⚠️ Peer disconnected, reconnecting...');
        try { peer.reconnect(); } catch(e) {}
    });

    peer.on('close', () => {
        log('⚠️ Peer closed');
        if (!isEnded) cleanup();
    });

    peer.on('error', err => {
        log('❌ Peer error: ' + err.type + ' — ' + err.message);
        
        if (err.type === 'peer-unavailable') {
            if (!callInitiated) {
                log('Peer unavailable but call not initiated — ignore');
                return;
            }
            if (retryCount < 20 && !isEnded && !callStarted) {
                retryCount++;
                document.getElementById('call-status').innerText = "Connecting... (try " + retryCount + ")";
                setTimeout(() => {
                    if (!isEnded && !callStarted) startCall(targetId);
                }, 2500);
            } else if (!isEnded) {
                stopAlerts();
                document.getElementById('call-status').innerText = "Peer offline. Tap END.";
            }
        } else if (err.type === 'unavailable-id') {
            log('ID taken, retrying with new peer in 3s');
            setTimeout(() => {
                try { peer.destroy(); } catch(e){}
                peer = null;
                setupPeer();
            }, 3000);
        } else if (err.type === 'network' || err.type === 'server-error') {
            setTimeout(() => {
                try { peer.destroy(); } catch(e){}
                peer = null;
                setupPeer();
            }, 4000);
        }
    });
}

/* ============================================================
   START CALL
   ============================================================ */
function startCall(targetId) {
    log('📞 startCall → ' + targetId);
    
    if (!peer || peer.destroyed) { log('❌ peer invalid'); return; }
    if (isEnded) { log('❌ call ended'); return; }
    if (callStarted) { log('✅ call already started'); return; }
    if (!localStream) {
        log('⏳ no localStream, waiting 500ms');
        setTimeout(() => startCall(targetId), 500);
        return;
    }
    
    // Close previous attempt (from retries)
    if (activeCall) {
        log('⚠️ Closing previous attempt');
        try { activeCall.close(); } catch(e) {}
        activeCall = null;
    }
    
    callInitiated = true;
    
    try {
        log('📞 peer.call()');
        activeCall = peer.call(targetId, localStream);
        log('📞 returned: ' + (activeCall ? 'conn=' + activeCall.connectionId : 'NULL'));
        
        if (activeCall) {
            handleStream(activeCall);
            
            // Data connection AFTER call, with delay
            setTimeout(() => {
                if (!isEnded && peer && !peer.destroyed) {
                    try {
                        log('🔗 peer.connect() for MODE sync');
                        dataConn = peer.connect(targetId, { reliable: true });
                        setupDataConn();
                    } catch(e) { log('⚠️ connect err: ' + e.message); }
                }
            }, 2000);
        } else {
            retryCount++;
            if (retryCount < 20) setTimeout(() => startCall(targetId), 2500);
        }
    } catch(e) {
        log('❌ peer.call threw: ' + e.message);
        retryCount++;
        if (retryCount < 20) setTimeout(() => startCall(targetId), 2500);
    }
}

function replaceStream(newStream) {
    if (activeCall && activeCall.peerConnection) {
        const senders = activeCall.peerConnection.getSenders();
        newStream.getTracks().forEach(t => {
            const s = senders.find(x => x.track && x.track.kind === t.kind);
            if (s) s.replaceTrack(t);
        });
    }
}

function setupDataConn() {
    if (!dataConn) return;
    dataConn.on('open', () => {
        log('🔗 Data conn open');
        try { dataConn.send({ type: 'MODE', active: isAutoHD }); } catch(e) {}
    });
    dataConn.on('data', d => {
        if (d === 'END_CALL' || (d && d.type === 'END_CALL')) cleanup(true);
        else if (d && d.type === 'MODE') setAutoHD(d.active, false);
    });
    dataConn.on('error', err => log('⚠️ Data err: ' + err.message));
}

/* ============================================================
   HANDLE STREAM
   ============================================================ */
function handleStream(call) {
    log('🎬 handleStream');
    stopAlerts();
    clearTimeout(connectTimeout);
    
    if (call.peerConnection) {
        applyBitrate(call.peerConnection);
        startStats(call.peerConnection);
        
        call.peerConnection.oniceconnectionstatechange = () => {
            const s = call.peerConnection.iceConnectionState;
            log('❄️ ICE: ' + s);
            if (s === 'connected' || s === 'completed') {
                document.getElementById('call-status').innerText = "Encrypted Call 🔒";
                clearTimeout(connectTimeout);
                applyBitrate(call.peerConnection);
            } else if (s === 'failed') {
                document.getElementById('call-status').innerText = "Connection failed";
            } else if (s === 'disconnected') {
                document.getElementById('call-status').innerText = "Reconnecting...";
            }
        };
    }

    call.on('stream', async stream => {
        log('📡 Got remote stream');
        document.getElementById('call-status').innerText = "Encrypted Call 🔒";
        document.getElementById('call-timer').style.display = 'block';
        startCallTimer();
        callStarted = true;
        stopAlerts();

        // Try AudioContext.setSinkId (mobile Chrome 110+)
        if (isMobile && !SINK_SUPPORTED && CTX_SINK_SUPPORTED) {
            try {
                if (!_callAudioCtx || _callAudioCtx.state === 'closed') {
                    _callAudioCtx = new AudioContext();
                    log('🔊 Created AudioContext');
                }
                if (_callAudioCtx.state === 'suspended') {
                    await _callAudioCtx.resume();
                }
                if (_callSourceNode) {
                    try { _callSourceNode.disconnect(); } catch(e) {}
                }
                _callSourceNode = _callAudioCtx.createMediaStreamSource(stream);
                _callSourceNode.connect(_callAudioCtx.destination);
                remoteAudio.muted = true;
                log('✅ AudioContext playback active');
                await applyOutput();
                return;
            } catch(e) {
                log('⚠️ AudioContext path failed: ' + (e.name || e.message));
                remoteAudio.muted = false;
                if (_callSourceNode) {
                    try { _callSourceNode.disconnect(); } catch(_) {}
                    _callSourceNode = null;
                }
            }
        }

        remoteAudio.srcObject = stream;
        remoteAudio.muted = false;
        remoteAudio.volume = 1.0;

        let played = false;
        for (let i = 0; i < 5; i++) {
            try {
                await remoteAudio.play();
                played = true;
                log('✅ Playing (attempt ' + (i+1) + ')');
                break;
            } catch(e) {
                log('⏳ play attempt ' + (i+1) + ' failed: ' + e.message);
                await new Promise(r => setTimeout(r, 200));
            }
        }
        if (!played) {
            document.getElementById('audio-fix-banner').style.display = 'block';
        } else {
            document.getElementById('audio-fix-banner').style.display = 'none';
        }
        
        await applyOutput();
    });

    call.on('close', () => {
        log('📴 Call closed');
        if (!isEnded) cleanup();
    });
    
    call.on('error', (err) => {
        log('❌ Call error: ' + (err.message || JSON.stringify(err)));
        if (!isEnded) cleanup();
    });
}

/* ============================================================
   AUDIO OUTPUT
   ============================================================ */
async function applyOutput() {
    remoteAudio.volume = isSpeakerOn ? 1.0 : 0.95;
    if (!remoteAudio.muted) remoteAudio.muted = false;

    if (isMobile && !SINK_SUPPORTED && CTX_SINK_SUPPORTED && _callAudioCtx) {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            let targetId = 'default';
            if (isSpeakerOn) {
                const spk = devices.find(d =>
                    d.kind === 'audiooutput' &&
                    /speaker|loudspeaker/i.test(d.label || '')
                );
                targetId = spk ? spk.deviceId : 'default';
            } else {
                const ear = devices.find(d =>
                    d.kind === 'audiooutput' &&
                    /earpiece|receiver|handset|inner/i.test(d.label || '')
                );
                targetId = ear ? ear.deviceId : 'default';
            }
            await _callAudioCtx.setSinkId(targetId);
            log('🎧 Context sink → ' + (isSpeakerOn ? 'Speaker' : 'Earpiece'));
            return;
        } catch(e) {
            log('⚠️ Context sink err: ' + (e.name || e.message));
        }
    }

    if (!SINK_SUPPORTED) {
        log('⚠️ setSinkId unavailable — OS default routing');
        return;
    }
    
    let target = 'default';
    
    if (isSpeakerOn) {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const spk = devices.find(d => 
                d.kind === 'audiooutput' && 
                /speaker|loudspeaker/i.test(d.label || '')
            );
            target = spk ? spk.deviceId : 'default';
        } catch(e) { target = 'default'; }
    } else {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const ear = devices.find(d => 
                d.kind === 'audiooutput' && 
                /earpiece|receiver|handset|inner/i.test(d.label || '')
            );
            if (ear) target = ear.deviceId;
            else target = 'communications';
        } catch(e) { target = 'communications'; }
    }
    
    try {
        await remoteAudio.setSinkId(target);
        log('🎧 Output: ' + target);
    } catch(e) {
        try { await remoteAudio.setSinkId('default'); } catch(_) {}
    }
}

function toggleAudioOutput() {
    isSpeakerOn = !isSpeakerOn;
    updateOutputUI();
    applyOutput();
}

function updateOutputUI() {
    const btn = document.getElementById('output-btn');
    const spk = document.getElementById('speaker-btn');
    if (isSpeakerOn) {
        btn.innerText = "🔊 Speaker Active";
        spk.classList.add('active');
    } else {
        btn.innerText = "🎧 Earpiece";
        spk.classList.remove('active');
    }
}

function forceUnlockAudio(e) {
    if (e) e.stopPropagation();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (_callAudioCtx && _callAudioCtx.state === 'suspended') _callAudioCtx.resume();
    remoteAudio.play().catch(() => {});
    document.getElementById('audio-fix-banner').style.display = 'none';
}

/* ============================================================
   AUTO HD ⇄ DATA SAVER
   ============================================================ */
function toggleAutoHD() {
    setAutoHD(!isAutoHD, true);
}

function setAutoHD(enabled, broadcast = true) {
    isAutoHD = !!enabled;
    updateAutoHDUI();
    const target = isAutoHD ? B_HD : B_SAVER;
    if (activeCall && activeCall.peerConnection) {
        applyBitrate(activeCall.peerConnection, target);
    }
    if (broadcast && dataConn && dataConn.open) {
        try { dataConn.send({ type: 'MODE', active: isAutoHD }); } catch(e) {}
    }
    log('🎚️ Mode: ' + (isAutoHD ? 'HD 16k' : 'Saver 12k'));
}

function updateAutoHDUI() {
    const btn = document.getElementById('auto-hd-btn');
    const mode = document.getElementById('mode-text');
    btn.classList.toggle('active', isAutoHD);
    if (isAutoHD) {
        btn.innerText = "🎧 Auto HD · 16kbps";
        mode.innerText = "Auto HD Mode";
    } else {
        btn.innerText = "🪶 Data Saver · 12kbps";
        mode.innerText = "Data Saver · 12kbps";
    }
}

/* ============================================================
   BITRATE
   ============================================================ */
try {
    const tpc = new RTCPeerConnection({ iceServers: [] });
    const ts = tpc.addTransceiver('audio', { direction: 'sendrecv' }).sender;
    const tp = ts.getParameters();
    _canSetParams = !!(tp && tp.encodings && tp.encodings.length > 0);
    tpc.close();
} catch(e) { _canSetParams = false; }

function applyBitrate(pc, bitrate) {
    if (!_canSetParams || !pc) return;
    const target = bitrate || (isAutoHD ? B_HD : B_SAVER);
    try {
        pc.getSenders().forEach(s => {
            if (!s.track || s.track.kind !== 'audio') return;
            try {
                const p = s.getParameters();
                if (!p.encodings || !p.encodings[0]) return;
                p.encodings[0].maxBitrate = target;
                p.encodings[0].dtx = true;
                p.encodings[0].networkPriority = 'high';
                s.setParameters(p).catch(() => {});
            } catch(e) {}
        });
    } catch(e) {}
}

/* ============================================================
   STATS
   ============================================================ */
function startStats(pc) {
    if (statsTimer) clearInterval(statsTimer);
    _pc = pc; _lastRx = 0; _lastTx = 0; _lastTs = 0;
    document.getElementById('signal-bar').style.display = 'block';
    
    statsTimer = setInterval(async () => {
        try {
            if (!_pc || _pc.connectionState === 'closed' || document.hidden) return;
            const stats = await _pc.getStats();
            let inb = null, outb = null, pair = null;
            stats.forEach(r => {
                if (r.type === 'inbound-rtp' && r.kind === 'audio') inb = r;
                else if (r.type === 'outbound-rtp' && r.kind === 'audio') outb = r;
                else if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated) pair = r;
            });
            
            const now = Date.now();
            if (!_lastTs) _lastTs = now;
            const dt = (now - _lastTs) / 1000 || 1;
            
            let kbpsIn = 0, kbpsOut = 0;
            if (inb && inb.bytesReceived) {
                kbpsIn = Math.round((inb.bytesReceived - _lastRx) * 8 / 1000 / dt);
                _lastRx = inb.bytesReceived;
            }
            if (outb && outb.bytesSent) {
                kbpsOut = Math.round((outb.bytesSent - _lastTx) * 8 / 1000 / dt);
                _lastTx = outb.bytesSent;
            }
            _lastTs = now;
            
            let rtt = pair && pair.currentRoundTripTime ? Math.round(pair.currentRoundTripTime * 1000) : 0;
            
            let lossPct = 0;
            if (inb && inb.packetsLost && inb.packetsReceived) {
                lossPct = inb.packetsLost / (inb.packetsLost + inb.packetsReceived) * 100;
            }
            
            const prev = _netQuality;
            if (rtt > 700 || lossPct > 15) _netQuality = 'weak';
            else if (rtt > 350 || lossPct > 6) _netQuality = 'ok';
            else _netQuality = 'good';
            
            let icon = '▁▃▅▇', color = '#38ef7d';
            if (_netQuality === 'weak') { icon = '▁▁▁▁'; color = '#ea0038'; }
            else if (_netQuality === 'ok') { icon = '▁▃▅▁'; color = '#ffb74d'; }
            
            const si = document.getElementById('signal-icon');
            const ss = document.getElementById('stats-text');
            si.textContent = icon;
            si.style.color = color;
            ss.textContent = `↓${kbpsIn}↑${kbpsOut}kbps · ${rtt}ms`;
            
            if (_canSetParams && prev !== _netQuality) {
                let target = isAutoHD ? B_HD : B_SAVER;
                if (_netQuality === 'weak') target = B_WEAK;
                applyBitrate(_pc, target);
            }
        } catch(e) {}
    }, 10000);
}

function stopStats() {
    if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
    _pc = null;
    document.getElementById('signal-bar').style.display = 'none';
}

/* ============================================================
   TIMER
   ============================================================ */
function startCallTimer() {
    if (callTimer) return;
    callTimer = setInterval(() => {
        callSeconds++;
        const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const s = String(callSeconds % 60).padStart(2, '0');
        document.getElementById('call-timer').innerText = `${m}:${s}`;
    }, 1000);
}

/* ============================================================
   CONTROLS
   ============================================================ */
function toggleMute() {
    if (!localStream) return;
    isMuted = !isMuted;
    localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
    const b = document.getElementById('mute-btn');
    b.classList.toggle('active', isMuted);
    b.innerText = isMuted ? "🔇 Unmute" : "🎙️ Mute";
}

function endCallAndClose() {
    try { if (dataConn && dataConn.open) dataConn.send({ type: 'END_CALL' }); } catch(e) {}
    cleanup(false);
}

window.addEventListener('beforeunload', () => {
    try { if (dataConn && dataConn.open) dataConn.send({ type: 'END_CALL' }); } catch(e) {}
});

/* ============================================================
   WAKE LOCK
   ============================================================ */
async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
    } catch(e) {}
}

document.addEventListener('visibilitychange', () => {
    if (!document.hidden && callStarted && !wakeLock) requestWakeLock();
    if (document.hidden && statsTimer) { clearInterval(statsTimer); statsTimer = null; }
    if (!document.hidden && callStarted && _pc && !statsTimer) startStats(_pc);
});

/* ============================================================
   CLEANUP
   ============================================================ */
function cleanup(byRemote = false) {
    if (isEnded) return;
    isEnded = true;
    pendingFlow = null;
    
    log('🧹 Cleanup (byRemote=' + byRemote + ')');
    
    clearTimeout(connectTimeout);
    clearTimeout(incomingTimeout);
    stopAlerts();
    stopStats();
    if (callTimer) { clearInterval(callTimer); callTimer = null; }
    try { if (wakeLock) wakeLock.release(); } catch(e) {}
    
    try {
        if (_callSourceNode) {
            try { _callSourceNode.disconnect(); } catch(e) {}
            _callSourceNode = null;
        }
        if (_callAudioCtx && _callAudioCtx.state !== 'closed') {
            _callAudioCtx.close();
        }
        _callAudioCtx = null;
    } catch(e) {}
    
    try { if (activeCall) activeCall.close(); } catch(e) {}
    try { if (localStream) localStream.getTracks().forEach(t => t.stop()); } catch(e) {}
    try {
        remoteAudio.pause();
        remoteAudio.srcObject = null;
        remoteAudio.muted = false;
    } catch(e) {}
    try { if (dataConn) dataConn.close(); } catch(e) {}
    try { if (peer && !peer.destroyed) peer.destroy(); } catch(e) {}
    
    document.getElementById('call-status').innerText = byRemote ? "Ended. Returning..." : "Closed. Returning...";
    
    setTimeout(() => {
        try {
            if (redirectUrl) {
                location.replace(redirectUrl);
                return;
            }
            if (history.length > 1) {
                history.back();
                setTimeout(() => {
                    if (!document.hidden && document.referrer && document.referrer !== location.href) {
                        location.replace(document.referrer);
                    } else if (!document.hidden) {
                        try { window.close(); } catch(e) {}
                    }
                }, 600);
                return;
            }
            if (document.referrer && document.referrer !== location.href) {
                location.replace(document.referrer);
                return;
            }
            window.close();
            setTimeout(() => {
                document.getElementById('call-status').innerText = "Closed. Close this tab.";
            }, 500);
        } catch(e) {
            try { window.close(); } catch(_) {}
        }
    }, 400);
}
