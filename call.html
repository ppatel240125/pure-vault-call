<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Voice Node</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { background: #07090e; color: #00ff66; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; overflow: hidden; touch-action: none; }
        .box { background: #0b0e14; border: 1px solid #1f293d; padding: 25px; border-radius: 16px; width: 92%; max-width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h3 { color: #3b82f6; margin-bottom: 5px; font-size: 16px; letter-spacing: 1px; }
        p { font-size: 11px; color: #9ca3af; margin-bottom: 25px; }
        .status { font-size: 14px; margin: 20px 0; color: #ffb74d; font-weight: bold; min-height: 40px; display: flex; align-items: center; justify-content: center; }
        
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .ctrl-btn { background: #1f293d; color: #d1d5db; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s; outline: none; }
        .ctrl-btn.active { background: #1e3a8a; color: #60a5fa; border: 1px solid #3b82f6; }
        
        .end-btn { background: #7f1d1d; color: #fca5a5; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; outline: none; }
        .end-btn:hover { background: #991b1b; }

        .unmute-btn { background: #e53935; color: white; padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 0 15px rgba(229, 57, 53, 0.6); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="box">
        <h3>SECURE_VOICE_NODE</h3>
        <p>Encrypted 2G Low-Data Channel</p>
        <div id="call-status" class="status">Connecting to secure stream...</div>
        
        <audio id="remote-audio" autoplay playsinline webkit-playsinline></audio>

        <div class="controls-grid">
            <button id="mute-btn" class="ctrl-btn" onclick="toggleMute()">🎙️ Mute</button>
            <button id="speaker-btn" class="ctrl-btn" onclick="toggleSpeaker()">📞 Earpiece</button>
        </div>

        <button class="end-btn" onclick="endCallAndClose()">🔴 END CALL</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const role = urlParams.get('role');

        let localStream = null;
        let remoteAudioEl = document.getElementById('remote-audio');
        let isMuted = false;
        let isSpeakerOn = false; 
        let currentPeer = null;
        let wakeLock = null;
        let outgoingRingTimer = null;

        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

        async function requestWakeLock() {
            try { 
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen'); 
                }
            } catch (err) { console.log("WakeLock error:", err); }
        }
        
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        if (!roomId) {
            document.getElementById('call-status').innerText = "Error: Invalid Room ID";
        } else {
            initAudioCall();
            requestWakeLock();
            if (role === 'caller') playOutgoingRingtone();
        }

        function playOutgoingRingtone() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            outgoingRingTimer = setInterval(() => {
                if (!localStream || document.getElementById('call-status').innerText.includes("Active")) {
                    clearInterval(outgoingRingTimer);
                    return;
                }
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime); 
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.8);
                } catch(e){}
            }, 3000);
        }

        function initAudioCall() {
            navigator.mediaDevices.getUserMedia({ 
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, 
                video: false 
            })
            .then(stream => {
                localStream = stream;
                const peerId = `vault_v3_${roomId}_${role}`;
                const targetRole = role === 'caller' ? 'receiver' : 'caller';
                const targetPeerId = `vault_v3_${roomId}_${targetRole}`;

                currentPeer = new Peer(peerId, {
                    host: '0.peerjs.com', port: 443, path: '/', secure: true,
                    config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] }
                });

                currentPeer.on('open', () => {
                    document.getElementById('call-status').innerText = "Ringing...";
                    setTimeout(() => tryConnect(targetPeerId), 800);
                });

                currentPeer.on('call', (call) => {
                    if(outgoingRingTimer) clearInterval(outgoingRingTimer);
                    document.getElementById('call-status').innerText = "Connecting...";
                    call.answer(localStream);
                    handleCallStream(call);
                });

                currentPeer.on('error', () => {
                    document.getElementById('call-status').innerText = "Connection Failed.";
                });
            })
            .catch(() => {
                document.getElementById('call-status').innerText = "Microphone access denied!";
            });
        }

        function tryConnect(targetPeerId) {
            if (!currentPeer || currentPeer.destroyed) return;
            const call = currentPeer.call(targetPeerId, localStream);
            if (call) handleCallStream(call);
            else setTimeout(() => tryConnect(targetPeerId), 2000);
        }

        // ઈયરપીસમાં ફોર્સ કરવા માટેનું સેફ (Safe) ફંક્શન
        async function forceEarpieceDefault() {
            if (typeof remoteAudioEl.setSinkId === 'undefined') {
                console.log("Audio routing not supported. Playing on default speaker.");
                return; // જો સપોર્ટ ન હોય તો કશું જ ના કરો, અવાજ ડિફોલ્ટ આવવા દો.
            }
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioOutputs = devices.filter(device => device.kind === 'audiooutput');
                
                // ખાસ ઈયરપીસ (Earpiece/Handset) શોધો
                let earpiece = audioOutputs.find(d => 
                    d.label.toLowerCase().includes('earpiece') || d.label.toLowerCase().includes('handset')
                );
                
                // જો ઈયરપીસ મળે તો જ અવાજ તેમાં નાખો, નહીંતર એમનેમ રહેવા દો.
                if (earpiece) {
                    await remoteAudioEl.setSinkId(earpiece.deviceId);
                    console.log("Routed to Earpiece.");
                } else {
                    console.log("No specific earpiece found. Playing on default speaker.");
                }
            } catch (error) {
                console.log('Earpiece force error:', error);
            }
        }

        function handleCallStream(call) {
            if(outgoingRingTimer) clearInterval(outgoingRingTimer);
            call.on('stream', (remoteStream) => {
                document.getElementById('call-status').innerText = "Active Call 🟢";
                remoteAudioEl.srcObject = remoteStream;
                remoteAudioEl.volume = 0.8; 
                
                // ઓડિયો પ્લે કરવાની કોશિશ
                remoteAudioEl.play().then(() => {
                    forceEarpieceDefault(); 
                }).catch((error) => {
                    console.log("Autoplay blocked by browser:", error);
                    // જો બ્રાઉઝર અવાજ રોકે તો લાલ બટન આપો
                    document.getElementById('call-status').innerHTML = `<button class="unmute-btn" onclick="forcePlayAudio()">🔊 Tap to Unmute Call</button>`;
                });
            });
            call.on('close', () => {
                window.close();
            });
        }

        // યુઝર બટન દબાવે ત્યારે અવાજ ચાલુ કરવા
        window.forcePlayAudio = function() {
            remoteAudioEl.play().then(() => {
                document.getElementById('call-status').innerText = "Active Call 🟢";
                forceEarpieceDefault();
            }).catch(e => console.log(e));
        };

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => { track.enabled = !isMuted; });
            const muteBtn = document.getElementById('mute-btn');
            muteBtn.classList.toggle('active', isMuted);
            muteBtn.innerText = isMuted ? "🔇 Unmute" : "🎙️ Mute";
        }

        // સ્પીકર અને ઈયરપીસ બદલવા માટેનું સેફ (Safe) ફંક્શન
        async function toggleSpeaker() {
            isSpeakerOn = !isSpeakerOn;
            const speakerBtn = document.getElementById('speaker-btn');
            const statusEl = document.getElementById('call-status');
            const isAutoplayBlocked = statusEl.innerHTML.includes('unmute-btn');
            
            // જો બ્રાઉઝર સપોર્ટ ન કરતું હોય, તો ફક્ત વોલ્યુમ વધારી-ઘટાડીને કામ ચલાવશે (અવાજ બંધ નહીં કરે)
            if (typeof remoteAudioEl.setSinkId !== 'undefined') {
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const audioOutputs = devices.filter(device => device.kind === 'audiooutput');
                    
                    if (audioOutputs.length > 0) {
                        let targetDevice = audioOutputs.find(d => 
                            isSpeakerOn ? d.label.toLowerCase().includes('speaker') : (d.label.toLowerCase().includes('earpiece') || d.label.toLowerCase().includes('handset'))
                        );
                        
                        if (targetDevice) {
                            await remoteAudioEl.setSinkId(targetDevice.deviceId);
                        } else if (audioOutputs.length > 1) {
                            targetDevice = isSpeakerOn ? audioOutputs[audioOutputs.length - 1] : audioOutputs[0];
                            await remoteAudioEl.setSinkId(targetDevice.deviceId);
                        }
                    }
                } catch (error) { console.log(error); }
            } else {
                // સપોર્ટ નથી તો એક નાનકડી વોર્નિંગ બતાવશે, પણ કૉલ ચાલુ જ રહેશે
                console.log("Speaker toggle not fully supported by this browser.");
            }

            // UI અને વોલ્યુમ બદલો (સપોર્ટ હોય કે ના હોય)
            if (isSpeakerOn) {
                speakerBtn.classList.add('active');
                speakerBtn.innerText = "🔊 Speaker ON";
                if(!isAutoplayBlocked) statusEl.innerText = "Active Call 🔊";
                remoteAudioEl.volume = 1.0; 
            } else {
                speakerBtn.classList.remove('active');
                speakerBtn.innerText = "📞 Earpiece";
                if(!isAutoplayBlocked) statusEl.innerText = "Active Call 🟢";
                remoteAudioEl.volume = 0.8; 
            }
        }

        function endCallAndClose() {
            if(outgoingRingTimer) clearInterval(outgoingRingTimer);
            if (wakeLock !== null) wakeLock.release().catch(() => {});
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            if (currentPeer) currentPeer.destroy();
            window.close();
        }
    </script>
</body>
</html>
