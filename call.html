<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<title>Secure Voice Node</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background: #07090e;
    color: #ffffff;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    touch-action: manipulation;
}

.box {
    width: 92%;
    max-width: 360px;
    background: #0b0e14;
    border: 1px solid #1f293d;
    border-radius: 16px;
    padding: 26px;
    text-align: center;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,.8);
}

.e2e-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 10px;
    color: #4ade80;
    border: 1px solid #166534;
    background: rgba(21,128,61,.2);
}

h3 {
    color: #3b82f6;
    font-size: 16px;
    margin: 10px 0 5px;
}

p {
    color: #9ca3af;
    font-size: 11px;
}

#call-timer {
    display: none;
    font-size: 26px;
    font-weight: bold;
    margin: 12px 0;
    color: white;
}

.status {
    min-height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffb74d;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
}

.controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 14px;
}

.ctrl-btn {
    border: none;
    border-radius: 10px;
    padding: 14px;
    background: #1f293d;
    color: #d1d5db;
    font-weight: bold;
    cursor: pointer;
}

.ctrl-btn.active {
    background: #1e3a8a;
    color: #60a5fa;
    border: 1px solid #3b82f6;
}

.full-width-btn {
    grid-column: span 2;
}

.end-btn {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #7f1d1d;
    color: #fca5a5;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.start-audio-btn {
    border: none;
    border-radius: 10px;
    padding: 12px;
    background: #2563eb;
    color: white;
    font-weight: bold;
}

</style>

</head>

<body>

<div
    class="box"
    id="main-box"
>

<div class="e2e-badge">
🔒 P2P
</div>

<h3>
SECURE VOICE NODE
</h3>

<p>
Fast P2P Voice Channel
</p>

<div
    id="call-timer"
>
00:00
</div>

<div
    id="call-status"
    class="status"
>
Preparing microphone...
</div>

<audio
id="remote-audio"
autoplay
playsinline

> </audio>

<div class="controls-grid">

<button
id="mute-btn"
class="ctrl-btn"
onclick="toggleMute()"

>

🎙️ Mute </button>

<button
id="speaker-btn"
class="ctrl-btn"
onclick="toggleSpeaker()"

>

🔊 Speaker </button>

<button
id="quality-btn"
class="ctrl-btn full-width-btn"
onclick="toggleQuality()"

>

📶 Data Saver </button>

</div>

<button
class="end-btn"
onclick="endCallAndClose()"

>

🔴 END CALL </button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>

<script>

/* =====================================
   URL PARAMETERS
===================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const roomId =
    params.get("room");

const role =
    params.get("role");


/* =====================================
   VALIDATION
===================================== */

if (
    !roomId ||
    !role ||
    (
        role !== "caller" &&
        role !== "receiver"
    )
) {

    document
        .getElementById("call-status")
        .innerText =
        "Invalid call information.";

}


/* =====================================
   PEER IDS
===================================== */

const myPeerId =
    "voice_fast_" +
    roomId +
    "_" +
    role;


const targetRole =
    role === "caller"
    ? "receiver"
    : "caller";


const targetPeerId =
    "voice_fast_" +
    roomId +
    "_" +
    targetRole;


/* =====================================
   VARIABLES
===================================== */

let peer = null;

let localStream = null;

let currentCall = null;

let controlConnection = null;

let remoteAudio =
    document.getElementById(
        "remote-audio"
    );

let callStarted = false;

let callConnected = false;

let endingCall = false;

let remoteEnded = false;

let retryTimer = null;

let callTimer = null;

let callStartTime = null;

let wakeLock = null;

let isMuted = false;

let isSpeakerOn = false;

let isHighQuality = false;


/* =====================================
   STATUS
===================================== */

function setStatus(message) {

    document
        .getElementById(
            "call-status"
        )
        .innerText =
        message;

}


/* =====================================
   START
===================================== */

if (
    roomId &&
    (
        role === "caller" ||
        role === "receiver"
    )
) {

    startSystem();

}


/* =====================================
   START SYSTEM
===================================== */

async function startSystem() {

    try {

        setStatus(
            "Starting microphone..."
        );


        localStream =
            await getMicrophone();


        setStatus(
            "Connecting..."
        );


        createPeer();

    }

    catch(error) {

        showMicrophoneError(
            error
        );

    }

}


/* =====================================
   MICROPHONE
===================================== */

async function getMicrophone() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw {
            name:
            "SecurityError"
        };

    }


    try {

        return await
        navigator.mediaDevices
        .getUserMedia({

            audio: {

                echoCancellation:
                true,

                noiseSuppression:
                true,

                autoGainControl:
                true

            },

            video:
            false

        });

    }

    catch(error) {

        return await
        navigator.mediaDevices
        .getUserMedia({

            audio:
            true,

            video:
            false

        });

    }

}


/* =====================================
   MICROPHONE ERROR
===================================== */

function showMicrophoneError(error) {

    console.error(
        error
    );


    let message =
        "Microphone Error";


    if (
        error.name ===
        "NotAllowedError"
    ) {

        message =
        "Microphone permission denied.";

    }

    else if (
        error.name ===
        "NotFoundError"
    ) {

        message =
        "Microphone not found.";

    }

    else if (
        error.name ===
        "NotReadableError"
    ) {

        message =
        "Microphone is being used by another app.";

    }

    else if (
        error.name ===
        "SecurityError"
    ) {

        message =
        "HTTPS secure page required.";

    }


    setStatus(
        message
    );

}


/* =====================================
   CREATE PEER
===================================== */

function createPeer() {

    peer =
    new Peer(

        myPeerId,

        {

            host:
            "0.peerjs.com",

            port:
            443,

            path:
            "/",

            secure:
            true,

            config: {

                iceServers: [

                    {

                        urls:
                        "stun:stun.l.google.com:19302"

                    },

                    {

                        urls:
                        "stun:global.stun.twilio.com:3478"

                    }

                ]

            }

        }

    );


    /* PEER READY */

    peer.on(
        "open",
        function() {

            if (
                role ===
                "receiver"
            ) {

                setStatus(
                    "Waiting for caller..."
                );

            }

            else {

                setStatus(
                    "Calling..."
                );


                connectControl();

            }

        }
    );


    /* CONTROL CONNECTION */

    peer.on(
        "connection",
        function(connection) {

            setupControlConnection(
                connection
            );

        }
    );


    /* VOICE CALL */

    peer.on(
        "call",
        function(call) {

            if (
                endingCall
            ) {

                try {

                    call.close();

                }

                catch(e) {}

                return;

            }


            /*
               Duplicate call protection
            */

            if (
                currentCall &&
                !currentCall.closed
            ) {

                try {

                    call.close();

                }

                catch(e) {}

                return;

            }


            currentCall =
                call;


            setStatus(
                "Connecting call..."
            );


            try {

                call.answer(
                    localStream
                );

                setupVoiceCall(
                    call
                );

            }

            catch(error) {

                console.error(
                    error
                );

            }

        }
    );


    /* PEER ERROR */

    peer.on(
        "error",
        function(error) {

            console.error(
                "Peer Error:",
                error
            );


            if (
                endingCall
            ) return;


            if (
                role ===
                "caller"
            ) {

                scheduleRetry();

            }

        }
    );

}


/* =====================================
   CONTROL CONNECT
===================================== */

function connectControl() {

    if (
        endingCall ||
        callConnected
    ) return;


    if (
        controlConnection &&
        controlConnection.open
    ) {

        return;

    }


    try {

        const connection =
            peer.connect(
                targetPeerId,
                {

                    reliable:
                    true,

                    serialization:
                    "json"

                }
            );


        setupControlConnection(
            connection
        );

    }

    catch(error) {

        scheduleRetry();

    }

}


/* =====================================
   CONTROL CONNECTION
===================================== */

function setupControlConnection(
    connection
) {

    if (!connection) return;


    controlConnection =
        connection;


    connection.on(
        "open",
        function() {

            if (
                endingCall
            ) return;


            try {

                connection.send({

                    type:
                    "READY"

                });

            }

            catch(e) {}

        }
    );


    connection.on(
        "data",
        function(data) {

            if (
                !data ||
                endingCall
            ) return;


            /* READY */

            if (
                data.type ===
                "READY"
            ) {

                /*
                   ONLY CALLER STARTS CALL
                */

                if (
                    role ===
                    "caller" &&
                    !callStarted &&
                    !callConnected
                ) {

                    startVoiceCall();

                }

            }


            /* END */

            if (
                data.type ===
                "END"
            ) {

                remoteEnded =
                    true;


                endFromRemote();

            }

        }
    );


    connection.on(
        "close",
        function() {

            if (
                controlConnection ===
                connection
            ) {

                controlConnection =
                    null;

            }


            if (
                !endingCall &&
                !callConnected &&
                role ===
                "caller"
            ) {

                scheduleRetry();

            }

        }
    );


    connection.on(
        "error",
        function() {

            if (
                !endingCall &&
                role ===
                "caller"
            ) {

                scheduleRetry();

            }

        }
    );

}


/* =====================================
   START VOICE CALL
===================================== */

function startVoiceCall() {

    if (
        endingCall ||
        callStarted ||
        callConnected
    ) return;


    callStarted =
        true;


    setStatus(
        "Connecting call..."
    );


    try {

        const call =
            peer.call(
                targetPeerId,
                localStream
            );


        if (!call) {

            callStarted =
                false;

            scheduleRetry();

            return;

        }


        currentCall =
            call;


        setupVoiceCall(
            call
        );

    }

    catch(error) {

        callStarted =
            false;


        scheduleRetry();

    }

}


/* =====================================
   VOICE CALL
===================================== */

function setupVoiceCall(call) {

    call.on(
        "stream",
        function(remoteStream) {

            if (
                endingCall
            ) return;


            callConnected =
                true;


            callStarted =
                true;


            clearRetry();


            setStatus(
                "Active Call 🟢"
            );


            startTimer();


            requestWakeLock();


            setupMediaSession();


            remoteAudio.srcObject =
                remoteStream;


            remoteAudio
            .play()
            .catch(
                function() {

                    showAudioButton();

                }
            );

        }
    );


    call.on(
        "close",
        function() {

            /*
               If local user
               did not already end,
               remote side disconnected
            */

            if (
                !endingCall
            ) {

                endFromRemote();

            }

        }
    );


    call.on(
        "error",
        function() {

            if (
                !endingCall
            ) {

                endFromRemote();

            }

        }
    );

}


/* =====================================
   REMOTE END
===================================== */

function endFromRemote() {

    if (
        endingCall
    ) return;


    endingCall =
        true;


    clearRetry();


    stopTimer();


    stopLocalMedia();


    releaseWakeLock();


    closeConnections();


    setStatus(
        "Call Ended."
    );


    document
    .getElementById(
        "main-box"
    )
    .style.opacity =
    "0.45";


    /*
       Return to main page
    */

    setTimeout(
        function() {

            goBack();

        },

        700
    );

}


/* =====================================
   END BUTTON
===================================== */

function endCallAndClose() {

    if (
        endingCall
    ) return;


    endingCall =
        true;


    /*
       SEND END FIRST
    */

    if (
        controlConnection &&
        controlConnection.open
    ) {

        try {

            controlConnection.send({

                type:
                "END"

            });

        }

        catch(e) {}

    }


    setStatus(
        "Ending call..."
    );


    /*
       Small delay so END packet
       gets sent before connection closes
    */

    setTimeout(
        function() {

            finishLocalEnd();

        },

        250
    );

}


/* =====================================
   FINISH LOCAL END
===================================== */

function finishLocalEnd() {

    clearRetry();


    stopTimer();


    stopLocalMedia();


    releaseWakeLock();


    closeConnections();


    setStatus(
        "Call Ended."
    );


    document
    .getElementById(
        "main-box"
    )
    .style.opacity =
    "0.45";


    setTimeout(
        function() {

            goBack();

        },

        500
    );

}


/* =====================================
   CLOSE CONNECTIONS
===================================== */

function closeConnections() {

    const call =
        currentCall;


    currentCall =
        null;


    if (call) {

        try {

            call.close();

        }

        catch(e) {}

    }


    if (
        controlConnection
    ) {

        try {

            controlConnection.close();

        }

        catch(e) {}


        controlConnection =
            null;

    }


    if (peer) {

        try {

            peer.destroy();

        }

        catch(e) {}

    }

}


/* =====================================
   RETRY
===================================== */

function scheduleRetry() {

    if (
        endingCall ||
        callConnected ||
        role !==
        "caller"
    ) return;


    clearRetry();


    retryTimer =
    setTimeout(
        function() {

            retryTimer =
                null;


            callStarted =
                false;


            connectControl();

        },

        600
    );

}


function clearRetry() {

    if (
        retryTimer
    ) {

        clearTimeout(
            retryTimer
        );

        retryTimer =
            null;

    }

}


/* =====================================
   TIMER
===================================== */

function startTimer() {

    if (
        callTimer
    ) return;


    callStartTime =
        Date.now();


    document
    .getElementById(
        "call-timer"
    )
    .style.display =
    "block";


    callTimer =
    setInterval(
        function() {

            const diff =
            Math.floor(
                (
                    Date.now() -
                    callStartTime
                ) / 1000
            );


            const hours =
            Math.floor(
                diff / 3600
            );


            const minutes =
            Math.floor(
                (
                    diff % 3600
                ) / 60
            );


            const seconds =
            diff % 60;


            let text =
                "";


            if (
                hours > 0
            ) {

                text +=
                String(hours)
                .padStart(
                    2,
                    "0"
                )
                +
                ":";

            }


            text +=
            String(minutes)
            .padStart(
                2,
                "0"
            )
            +
            ":"
            +
            String(seconds)
            .padStart(
                2,
                "0"
            );


            document
            .getElementById(
                "call-timer"
            )
            .innerText =
            text;

        },

        1000
    );

}


function stopTimer() {

    if (
        callTimer
    ) {

        clearInterval(
            callTimer
        );

        callTimer =
            null;

    }

}


/* =====================================
   LOCAL MEDIA
===================================== */

function stopLocalMedia() {

    if (
        localStream
    ) {

        localStream
        .getTracks()
        .forEach(
            function(track) {

                track.stop();

            }
        );

    }

}


/* =====================================
   WAKE LOCK
===================================== */

async function requestWakeLock() {

    try {

        if (
            "wakeLock" in navigator
        ) {

            wakeLock =
            await navigator
            .wakeLock
            .request(
                "screen"
            );

        }

    }

    catch(e) {}

}


function releaseWakeLock() {

    if (
        wakeLock
    ) {

        wakeLock
        .release()
        .catch(
            function() {}
        );


        wakeLock =
            null;

    }

}


/* =====================================
   MEDIA SESSION
===================================== */

function setupMediaSession() {

    if (
        !(
            "mediaSession" in
            navigator
        )
    ) return;


    try {

        navigator
        .mediaSession
        .metadata =
        new MediaMetadata({

            title:
            "Active Voice Call",

            artist:
            "Secure Voice Node"

        });


        navigator
        .mediaSession
        .setActionHandler(
            "stop",
            function() {

                endCallAndClose();

            }
        );

    }

    catch(e) {}

}


/* =====================================
   MUTE
===================================== */

function toggleMute() {

    if (
        !localStream
    ) return;


    isMuted =
        !isMuted;


    localStream
    .getAudioTracks()
    .forEach(
        function(track) {

            track.enabled =
            !isMuted;

        }
    );


    const button =
    document.getElementById(
        "mute-btn"
    );


    if (
        isMuted
    ) {

        button
        .classList
        .add(
            "active"
        );


        button.innerHTML =
        "🔇 Unmute";

    }

    else {

        button
        .classList
        .remove(
            "active"
        );


        button.innerHTML =
        "🎙️ Mute";

    }

}


/* =====================================
   SPEAKER
===================================== */

function toggleSpeaker() {

    isSpeakerOn =
        !isSpeakerOn;


    const button =
    document.getElementById(
        "speaker-btn"
    );


    remoteAudio.volume =
    isSpeakerOn
    ?
    1
    :
    0.8;


    if (
        isSpeakerOn
    ) {

        button
        .classList
        .add(
            "active"
        );


        button.innerHTML =
        "🔊 Speaker";

    }

    else {

        button
        .classList
        .remove(
            "active"
        );


        button.innerHTML =
        "📞 Earpiece";

    }

}


/* =====================================
   QUALITY
===================================== */

function toggleQuality() {

    if (
        !localStream
    ) return;


    isHighQuality =
        !isHighQuality;


    const button =
    document.getElementById(
        "quality-btn"
    );


    localStream
    .getAudioTracks()
    .forEach(
        function(track) {

            if (
                !track.applyConstraints
            ) return;


            const constraints =
            isHighQuality
            ?
            {

                sampleRate: {

                    ideal:
                    48000

                },

                channelCount: {

                    ideal:
                    1

                }

            }
            :
            {

                sampleRate: {

                    ideal:
                    16000

                },

                channelCount: {

                    ideal:
                    1

                }

            };


            track
            .applyConstraints(
                constraints
            )
            .catch(
                function() {}
            );

        }
    );


    if (
        isHighQuality
    ) {

        button
        .classList
        .add(
            "active"
        );


        button.innerHTML =
        "📶 Smart HD";

    }

    else {

        button
        .classList
        .remove(
            "active"
        );


        button.innerHTML =
        "📶 Data Saver";

    }

}


/* =====================================
   AUTOPLAY
===================================== */

function showAudioButton() {

    document
    .getElementById(
        "call-status"
    )
    .innerHTML =
    '<button class="start-audio-btn" onclick="startRemoteAudio()">🔊 Tap to Start Audio</button>';

}


window.startRemoteAudio =
function() {

    remoteAudio
    .play()
    .then(
        function() {

            setStatus(
                "Active Call 🟢"
            );

        }
    )
    .catch(
        function() {

            showAudioButton();

        }
    );

};


/* =====================================
   GO BACK
===================================== */

function goBack() {

    try {

        window.close();

    }

    catch(e) {}


    setTimeout(
        function() {

            if (
                window.history.length >
                1
            ) {

                window.history.back();

            }

        },

        200
    );

}


/* =====================================
   PAGE CLOSE
===================================== */

window.addEventListener(
    "pagehide",
    function() {

        if (
            !endingCall &&
            callConnected
        ) {

            /*
               Try to notify remote side
            */

            try {

                if (
                    controlConnection &&
                    controlConnection.open
                ) {

                    controlConnection.send({

                        type:
                        "END"

                    });

                }

            }

            catch(e) {}

        }

    }
);

</script>

</body>
</html>
