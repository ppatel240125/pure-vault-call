<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>

<script>

/* =========================================
   URL PARAMETERS
========================================= */

const params =
    new URLSearchParams(window.location.search);

const roomId =
    params.get("room");

const role =
    params.get("role");


/* =========================================
   PEER IDs
========================================= */

const myPeerId =
    "vault_fast_" +
    roomId +
    "_" +
    role;


const targetRole =
    role === "caller"
    ? "receiver"
    : "caller";


const targetPeerId =
    "vault_fast_" +
    roomId +
    "_" +
    targetRole;


/* =========================================
   GLOBAL VARIABLES
========================================= */

let peer = null;

let localStream = null;

let currentCall = null;

let signalConnection = null;

let remoteAudio =
    document.getElementById("remote-audio");

let peerReady = false;

let remoteReady = false;

let callStarted = false;

let callConnected = false;

let endingCall = false;

let isMuted = false;

let isSpeakerOn = false;

let isHighQuality = false;

let retryTimer = null;

let timerInterval = null;

let callStartTime = null;

let wakeLock = null;


/* =========================================
   STATUS
========================================= */

function setStatus(text) {

    document
        .getElementById("call-status")
        .innerText = text;

}


/* =========================================
   VALIDATE URL
========================================= */

if (!roomId || !role) {

    setStatus(
        "Invalid call information."
    );

}

else if (
    role !== "caller" &&
    role !== "receiver"
) {

    setStatus(
        "Invalid call role."
    );

}

else {

    startSystem();

}


/* =========================================
   START SYSTEM
========================================= */

async function startSystem() {

    try {

        setStatus(
            "Requesting microphone..."
        );


        localStream =
            await getMicrophone();


        setStatus(
            "Microphone ready..."
        );


        await requestWakeLock();


        createPeer();

    }

    catch (error) {

        showMicrophoneError(error);

    }

}


/* =========================================
   GET MICROPHONE
========================================= */

async function getMicrophone() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        throw {
            name: "SecurityError"
        };

    }


    /*
       Android-friendly request
    */

    try {

        return await
            navigator.mediaDevices
                .getUserMedia({

                    audio: {

                        echoCancellation: true,

                        noiseSuppression: true,

                        autoGainControl: true

                    },

                    video: false

                });

    }

    catch (firstError) {

        /*
           Basic fallback
        */

        return await
            navigator.mediaDevices
                .getUserMedia({

                    audio: true,

                    video: false

                });

    }

}


/* =========================================
   MICROPHONE ERROR
========================================= */

function showMicrophoneError(error) {

    console.error(
        "Microphone error:",
        error
    );


    let message =
        "Microphone error.";


    if (
        error.name ===
        "NotAllowedError"
    ) {

        message =
            "Microphone permission denied. Browser Settings માં Allow કરો.";

    }

    else if (
        error.name ===
        "NotFoundError"
    ) {

        message =
            "Microphone મળ્યો નથી.";

    }

    else if (
        error.name ===
        "NotReadableError"
    ) {

        message =
            "Microphone હાલમાં બીજા App દ્વારા ઉપયોગમાં છે.";

    }

    else if (
        error.name ===
        "SecurityError"
    ) {

        message =
            "HTTPS secure page જરૂરી છે.";

    }

    else if (
        error.name
    ) {

        message =
            "Microphone Error: " +
            error.name;

    }


    setStatus(message);

}


/* =========================================
   CREATE PEER
========================================= */

function createPeer() {

    peer =
        new Peer(
            myPeerId,
            {

                host:
                    "0.peerjs.com",

                port:
                    443,

                path:
                    "/",

                secure:
                    true,

                config: {

                    iceServers: [

                        {
                            urls:
                                "stun:stun.l.google.com:19302"
                        },

                        {
                            urls:
                                "stun:global.stun.twilio.com:3478"
                        }

                    ]

                }

            }
        );


    /*
       PEER READY
    */

    peer.on(
        "open",
        function() {

            peerReady =
                true;


            if (
                role ===
                "receiver"
            ) {

                setStatus(
                    "Waiting for caller..."
                );

            }

            else {

                setStatus(
                    "Looking for receiver..."
                );


                startFastHandshake();

            }

        }
    );


    /*
       SIGNAL CONNECTION
    */

    peer.on(
        "connection",
        function(connection) {

            handleSignalConnection(
                connection
            );

        }
    );


    /*
       INCOMING VOICE CALL
    */

    peer.on(
        "call",
        function(call) {

            if (
                endingCall
            ) {

                try {
                    call.close();
                }
                catch(e) {}

                return;

            }


            if (
                currentCall
            ) {

                try {
                    call.close();
                }
                catch(e) {}

                return;

            }


            currentCall =
                call;


            setStatus(
                "Connecting..."
            );


            call.answer(
                localStream
            );


            handleVoiceCall(
                call
            );

        }
    );


    /*
       PEER ERROR
    */

    peer.on(
        "error",
        function(error) {

            console.error(
                "Peer error:",
                error
            );


            if (
                endingCall
            ) return;


            if (
                error.type ===
                "peer-unavailable"
            ) {

                remoteReady =
                    false;

            }


            if (
                role ===
                "caller"
            ) {

                scheduleFastRetry();

            }

        }
    );


    /*
       PEER DISCONNECTED
    */

    peer.on(
        "disconnected",
        function() {

            peerReady =
                false;

        }
    );

}


/* =========================================
   FAST HANDSHAKE
========================================= */

function startFastHandshake() {

    if (
        endingCall ||
        callConnected
    ) return;


    if (
        !peer ||
        peer.destroyed
    ) return;


    /*
       Already have an open signal
    */

    if (
        signalConnection &&
        signalConnection.open
    ) {

        signalConnection.send({

            type:
                "READY_CHECK"

        });

        return;

    }


    try {

        const connection =
            peer.connect(
                targetPeerId,
                {

                    reliable: true,

                    serialization:
                        "json"

                }
            );


        handleSignalConnection(
            connection
        );

    }

    catch(error) {

        scheduleFastRetry();

    }

}


/* =========================================
   HANDLE SIGNAL CONNECTION
========================================= */

function handleSignalConnection(
    connection
) {

    if (!connection) return;


    signalConnection =
        connection;


    connection.on(
        "open",
        function() {

            if (
                endingCall
            ) return;


            /*
               Tell the other phone:
               I am ready
            */

            try {

                connection.send({

                    type:
                        "READY",

                    role:
                        role

                });

            }

            catch(e) {}


            /*
               Caller waits for
               receiver READY
            */

            if (
                role ===
                "caller"
            ) {

                try {

                    connection.send({

                        type:
                            "READY_CHECK"

                    });

                }

                catch(e) {}

            }

        }
    );


    connection.on(
        "data",
        function(data) {

            if (
                endingCall
            ) return;


            if (!data) return;


            /*
               READY MESSAGE
            */

            if (
                data.type ===
                "READY"
            ) {

                remoteReady =
                    true;


                /*
                   Receiver is ready:
                   caller immediately calls
                */

                if (
                    role ===
                    "caller"
                ) {

                    startVoiceCallImmediately();

                }

            }


            /*
               READY CHECK
            */

            if (
                data.type ===
                "READY_CHECK"
            ) {

                try {

                    connection.send({

                        type:
                            "READY",

                        role:
                            role

                    });

                }

                catch(e) {}

            }


            /*
               END CALL MESSAGE
            */

            if (
                data.type ===
                "END_CALL"
            ) {

                remoteEndedCall();

            }

        }
    );


    connection.on(
        "close",
        function() {

            if (
                signalConnection ===
                connection
            ) {

                signalConnection =
                    null;

            }


            if (
                !callConnected &&
                role === "caller" &&
                !endingCall
            ) {

                scheduleFastRetry();

            }

        }
    );


    connection.on(
        "error",
        function() {

            if (
                !callConnected &&
                role === "caller" &&
                !endingCall
            ) {

                scheduleFastRetry();

            }

        }
    );

}


/* =========================================
   START VOICE CALL IMMEDIATELY
========================================= */

function startVoiceCallImmediately() {

    if (
        endingCall ||
        callStarted ||
        callConnected
    ) return;


    if (
        !peer ||
        !localStream
    ) return;


    callStarted =
        true;


    setStatus(
        "Connecting call..."
    );


    try {

        const call =
            peer.call(
                targetPeerId,
                localStream
            );


        if (!call) {

            callStarted =
                false;

            scheduleFastRetry();

            return;

        }


        currentCall =
            call;


        handleVoiceCall(
            call
        );

    }

    catch(error) {

        console.error(
            "Voice call error:",
            error
        );


        callStarted =
            false;


        scheduleFastRetry();

    }

}


/* =========================================
   FAST RETRY
========================================= */

function scheduleFastRetry() {

    if (
        endingCall ||
        callConnected ||
        role !== "caller"
    ) return;


    if (retryTimer) {

        clearTimeout(
            retryTimer
        );

    }


    retryTimer =
        setTimeout(
            function() {

                retryTimer =
                    null;


                callStarted =
                    false;


                startFastHandshake();

            },

            500
        );

}


/* =========================================
   HANDLE VOICE CALL
========================================= */

function handleVoiceCall(call) {

    if (!call) return;


    call.on(
        "stream",
        function(remoteStream) {

            if (
                endingCall
            ) return;


            callConnected =
                true;


            callStarted =
                true;


            if (retryTimer) {

                clearTimeout(
                    retryTimer
                );

                retryTimer =
                    null;

            }


            setStatus(
                "Active Call 🟢"
            );


            startCallTimer();


            requestWakeLock();


            setupMediaSession();


            remoteAudio.srcObject =
                remoteStream;


            remoteAudio.volume =
                isSpeakerOn
                ? 1
                : 0.8;


            remoteAudio
                .play()
                .catch(
                    function() {

                        showStartAudioButton();

                    }
                );

        }
    );


    call.on(
        "close",
        function() {

            if (
                endingCall
            ) return;


            handleCallDisconnected();

        }
    );


    call.on(
        "error",
        function(error) {

            console.error(
                "Call error:",
                error
            );


            if (
                endingCall
            ) return;


            handleCallDisconnected();

        }
    );

}


/* =========================================
   CALL DISCONNECTED
========================================= */

function handleCallDisconnected() {

    callConnected =
        false;


    callStarted =
        false;


    currentCall =
        null;


    stopCallTimer();


    if (
        endingCall
    ) return;


    if (
        role ===
        "caller"
    ) {

        setStatus(
            "Reconnecting..."
        );


        scheduleFastRetry();

    }

    else {

        setStatus(
            "Call ended."
        );

    }

}


/* =========================================
   AUDIO AUTOPLAY BUTTON
========================================= */

function showStartAudioButton() {

    const status =
        document.getElementById(
            "call-status"
        );


    status.innerHTML =
        '<button class="start-audio-btn" onclick="startRemoteAudio()">🔊 Tap to Start Audio</button>';

}


window.startRemoteAudio =
function() {

    remoteAudio
        .play()
        .then(
            function() {

                setStatus(
                    "Active Call 🟢"
                );

            }
        )
        .catch(
            function() {

                showStartAudioButton();

            }
        );

};


/* =========================================
   CALL TIMER
========================================= */

function startCallTimer() {

    if (timerInterval) return;


    callStartTime =
        Date.now();


    document
        .getElementById(
            "call-timer"
        )
        .style.display =
        "block";


    timerInterval =
        setInterval(
            function() {

                const seconds =
                    Math.floor(
                        (
                            Date.now() -
                            callStartTime
                        ) / 1000
                    );


                const hours =
                    Math.floor(
                        seconds / 3600
                    );


                const minutes =
                    Math.floor(
                        (
                            seconds % 3600
                        ) / 60
                    );


                const secs =
                    seconds % 60;


                let result = "";


                if (
                    hours > 0
                ) {

                    result +=
                        String(hours)
                        .padStart(2,"0") +
                        ":";

                }


                result +=
                    String(minutes)
                    .padStart(2,"0") +
                    ":" +
                    String(secs)
                    .padStart(2,"0");


                document
                    .getElementById(
                        "call-timer"
                    )
                    .innerText =
                    result;

            },

            1000
        );

}


function stopCallTimer() {

    if (timerInterval) {

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;

    }

}


/* =========================================
   WAKE LOCK
========================================= */

async function requestWakeLock() {

    try {

        if (
            "wakeLock" in navigator &&
            document.visibilityState ===
            "visible"
        ) {

            wakeLock =
                await navigator
                    .wakeLock
                    .request(
                        "screen"
                    );

        }

    }

    catch(e) {}

}


document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "visible" &&
            callConnected
        ) {

            requestWakeLock();

        }

    }
);


/* =========================================
   MEDIA SESSION
========================================= */

function setupMediaSession() {

    if (
        !("mediaSession" in navigator)
    ) return;


    try {

        navigator
            .mediaSession
            .metadata =
            new MediaMetadata({

                title:
                    "Active Voice Call",

                artist:
                    "Secure Voice Node"

            });


        navigator
            .mediaSession
            .setActionHandler(
                "stop",
                function() {

                    endCallAndClose();

                }
            );

    }

    catch(e) {}

}


/* =========================================
   MUTE
========================================= */

function toggleMute() {

    if (!localStream) return;


    isMuted =
        !isMuted;


    localStream
        .getAudioTracks()
        .forEach(
            function(track) {

                track.enabled =
                    !isMuted;

            }
        );


    const button =
        document.getElementById(
            "mute-btn"
        );


    if (isMuted) {

        button
            .classList
            .add(
                "active"
            );


        button.innerHTML =
            "🔇 Unmute";

    }

    else {

        button
            .classList
            .remove(
                "active"
            );


        button.innerHTML =
            "🎙️ Mute";

    }

}


/* =========================================
   SPEAKER
========================================= */

async function toggleSpeaker() {

    isSpeakerOn =
        !isSpeakerOn;


    const button =
        document.getElementById(
            "speaker-btn"
        );


    remoteAudio.volume =
        isSpeakerOn
        ? 1
        : 0.8;


    /*
       setSinkId works only
       on supported browsers
    */

    if (
        typeof remoteAudio.setSinkId !==
        "undefined"
    ) {

        try {

            const devices =
                await navigator
                    .mediaDevices
                    .enumerateDevices();


            const outputs =
                devices.filter(
                    device =>
                    device.kind ===
                    "audiooutput"
                );


            let device = null;


            if (isSpeakerOn) {

                device =
                    outputs.find(
                        d =>
                        (
                            d.label ||
                            ""
                        )
                        .toLowerCase()
                        .includes(
                            "speaker"
                        )
                    );

            }

            else {

                device =
                    outputs.find(
                        d => {

                            const label =
                                (
                                    d.label ||
                                    ""
                                )
                                .toLowerCase();


                            return (
                                label.includes(
                                    "earpiece"
                                ) ||
                                label.includes(
                                    "handset"
                                )
                            );

                        }
                    );

            }


            if (device) {

                await remoteAudio
                    .setSinkId(
                        device.deviceId
                    );

            }

        }

        catch(e) {}

    }


    if (isSpeakerOn) {

        button
            .classList
            .add(
                "active"
            );


        button.innerHTML =
            "🔊 Speaker";

    }

    else {

        button
            .classList
            .remove(
                "active"
            );


        button.innerHTML =
            "📞 Earpiece";

    }

}


/* =========================================
   QUALITY
========================================= */

function toggleQuality() {

    if (!localStream) return;


    isHighQuality =
        !isHighQuality;


    const button =
        document.getElementById(
            "quality-btn"
        );


    localStream
        .getAudioTracks()
        .forEach(
            function(track) {

                if (
                    !track.applyConstraints
                ) return;


                if (isHighQuality) {

                    track
                        .applyConstraints({

                            sampleRate: {
                                ideal: 48000
                            },

                            channelCount: {
                                ideal: 1
                            }

                        })
                        .catch(
                            function() {}
                        );

                }

                else {

                    track
                        .applyConstraints({

                            sampleRate: {
                                ideal: 16000
                            },

                            channelCount: {
                                ideal: 1
                            }

                        })
                        .catch(
                            function() {}
                        );

                }

            }
        );


    if (isHighQuality) {

        button
            .classList
            .add(
                "active"
            );


        button.innerHTML =
            "📶 Smart HD";

    }

    else {

        button
            .classList
            .remove(
                "active"
            );


        button.innerHTML =
            "📶 Data Saver";

    }

}


/* =========================================
   REMOTE END CALL
========================================= */

function remoteEndedCall() {

    if (endingCall) return;


    endingCall =
        true;


    stopEverything(
        false
    );


    setStatus(
        "Call Ended."
    );


    document
        .getElementById(
            "main-box"
        )
        .style.opacity =
        "0.5";

}


/* =========================================
   END CALL
========================================= */

function endCallAndClose() {

    if (endingCall) return;


    endingCall =
        true;


    /*
       Inform other phone first
    */

    try {

        if (
            signalConnection &&
            signalConnection.open
        ) {

            signalConnection.send({

                type:
                    "END_CALL"

            });

        }

    }

    catch(e) {}


    stopEverything(
        true
    );


    setStatus(
        "Call Ended."
    );


    document
        .getElementById(
            "main-box"
        )
        .style.opacity =
        "0.5";


    setTimeout(
        function() {

            window.close();


            if (
                window.history.length > 1
            ) {

                setTimeout(
                    function() {

                        window.history.back();

                    },

                    300
                );

            }

        },

        700
    );

}


/* =========================================
   STOP EVERYTHING
========================================= */

function stopEverything(
    destroyPeer
) {

    callConnected =
        false;


    callStarted =
        false;


    remoteReady =
        false;


    stopCallTimer();


    if (retryTimer) {

        clearTimeout(
            retryTimer
        );

        retryTimer =
            null;

    }


    if (wakeLock) {

        wakeLock
            .release()
            .catch(
                function() {}
            );

        wakeLock =
            null;

    }


    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

    }


    if (currentCall) {

        try {

            currentCall.close();

        }

        catch(e) {}


        currentCall =
            null;

    }


    if (signalConnection) {

        try {

            signalConnection.close();

        }

        catch(e) {}


        signalConnection =
            null;

    }


    if (
        destroyPeer &&
        peer
    ) {

        try {

            peer.destroy();

        }

        catch(e) {}

    }

}


/* =========================================
   END
========================================= */

</script>
