<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Voice Node - HD</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { background: #07090e; color: #00ff66; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; overflow: hidden; touch-action: none; }
        .box { background: #0b0e14; border: 1px solid #1f293d; padding: 25px; border-radius: 16px; width: 92%; max-width: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; }
        h3 { color: #3b82f6; margin-bottom: 5px; font-size: 16px; letter-spacing: 1px; }
        p { font-size: 11px; color: #9ca3af; margin-bottom: 15px; }
        .status { font-size: 13px; margin: 15px 0; color: #ffb74d; font-weight: bold; }
        .timer { font-size: 18px; color: #60a5fa; margin-bottom: 15px; font-weight: bold; letter-spacing: 2px; }
        
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .ctrl-btn { background: #1f293d; color: #d1d5db; border: none; padding: 12px 6px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 11px; transition: 0.2s; outline: none; }
        .ctrl-btn.active { background: #1e3a8a; color: #60a5fa; border: 1px solid #3b82f6; }
        
        .end-btn { background: #7f1d1d; color: #fca5a5; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; outline: none; margin-top: 5px; }
        .end-btn:hover { background: #991b1b; }
        
        #touch-shield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; display: none; background: rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="touch-shield"></div>
    <div class="box">
        <h3>SECURE_VOICE_NODE</h3>
        <p id="mode-text">Data Saver Mode (2G Optimized)</p>
        <div id="call-status" class="status">Initializing channel...</div>
        <div id="call-timer" class="timer" style="display:none;">00:00</div>
        
        <audio id="remote-audio" autoplay playsinline></audio>

        <div class="controls-grid">
            <button id="mute-btn" class="ctrl-btn" onclick="toggleMute()">🎙️ Mute</button>
            <button id="speaker-btn" class="ctrl-btn" onclick="toggleSpeaker()">🔊 Speaker</button>
            <button id="hd-btn" class="ctrl-btn" onclick="toggleHDMode()">⚡ HD Off</button>
            <button id="audio-unlock-btn" class="ctrl-btn" onclick="unlockAudioContext()" style="background:#14532d; color:#86efac;">🔔 Enable Ring</button>
        </div>

        <button class="end-btn" onclick="endCallAndClose()">🔴 END CALL</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const role = urlParams.get('role');
        const redirectUrl = urlParams.get('back') || '/';

        let localStream = null;
        let activeCall = null;
        let remoteAudioEl = document.getElementById('remote-audio');
        let isMuted = false;
        let isSpeakerOn = false;
        let isHDActive = false;
        let currentPeer = null;
        let dataConnection = null;
        let wakeLock = null;
        let ringTimer = null;
        let vibrateInterval = null;
        let callTimerInterval = null;
        let callSeconds = 0;
        let audioCtx = null;

        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

        function setTouchProtection(enable) {
            document.getElementById('touch-shield').style.display = enable ? 'block' : 'none';
        }

        async function requestWakeLock() {
            try { 
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen'); 
                }
            } catch (err) {}
        }

        // Browser Auto-play policy bypass button click handler
        function unlockAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            document.getElementById('audio-unlock-btn').style.display = 'none';
            playBeepRingtone();
        }

        if (!roomId || !role) {
            document.getElementById('call-status').innerText = "Error: Invalid Room/Role";
        } else {
            startAlerts();
            initAudioCall();
            requestWakeLock();
        }

        function startAlerts() {
            // Mobile Vibration
            if ('vibrate' in navigator) {
                vibrateInterval = setInterval(() => {
                    try { navigator.vibrate([200, 300, 200, 800]); } catch(e){}
                }, 2000);
            }
            // PC Beep-Beep Ringing Setup
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                playBeepRingtone();
            } catch(e) {}
        }

        function playBeepRingtone() {
            if (ringTimer) return;
            ringTimer = setInterval(() => {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    // Traditional telephone beep frequency (440Hz / 480Hz)
                    osc.frequency.setValueAtTime(480, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                } catch(e){}
            }, 2500);
        }

        function stopAlerts() {
            if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
            if (vibrateInterval) { clearInterval(vibrateInterval); vibrateInterval = null; }
            if ('vibrate' in navigator) { try { navigator.vibrate(0); } catch(e){} }
            const unlockBtn = document.getElementById('audio-unlock-btn');
            if (unlockBtn) unlockBtn.style.display = 'none';
        }

        function initAudioCall() {
            navigator.mediaDevices.getUserMedia({ 
                audio: { 
                    echoCancellation: true, 
                    noiseSuppression: true, 
                    autoGainControl: true,
                    sampleRate: 16000 // Data saver base
                }, 
                video: false 
            })
            .then(stream => {
                localStream = stream;
                const peerId = `secure_v6_${roomId}_${role}`;
                const targetRole = role === 'caller' ? 'receiver' : 'caller';
                const targetPeerId = `secure_v6_${roomId}_${targetRole}`;

                currentPeer = new Peer(peerId, {
                    host: '0.peerjs.com', port: 443, path: '/', secure: true,
                    config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] }
                });

                currentPeer.on('open', () => {
                    document.getElementById('call-status').innerText = role === 'caller' ? "Calling... (Ringing)" : "Incoming Call...";
                    setTimeout(() => tryConnect(targetPeerId), 800);
                });

                currentPeer.on('connection', (conn) => {
                    dataConnection = conn;
                    setupDataConnectionEvents();
                });

                currentPeer.on('call', (call) => {
                    activeCall = call;
                    stopAlerts();
                    call.answer(localStream);
                    handleCallStream(call);
                });

                currentPeer.on('error', () => {
                    document.getElementById('call-status').innerText = "Connecting...";
                });
            })
            .catch(() => {
                stopAlerts();
                document.getElementById('call-status').innerText = "Microphone permission required!";
            });
        }

        function tryConnect(targetPeerId) {
            if (!currentPeer || currentPeer.destroyed) return;
            
            dataConnection = currentPeer.connect(targetPeerId);
            setupDataConnectionEvents();

            const call = currentPeer.call(targetPeerId, localStream);
            if (call) {
                activeCall = call;
                handleCallStream(call);
            } else {
                setTimeout(() => tryConnect(targetPeerId), 2000);
            }
        }

        function setupDataConnectionEvents() {
            if (!dataConnection) return;
            dataConnection.on('data', (data) => {
                if (data === 'END_CALL') {
                    executeCleanupAndExit();
                } else if (data && data.type === 'HD_SYNC') {
                    applyRemoteHDState(data.active);
                }
            });
        }

        function handleCallStream(call) {
            stopAlerts();
            
            call.on('stream', (remoteStream) => {
                document.getElementById('call-status').innerText = "Encrypted Active Call 🔒 (Earpiece)";
                document.getElementById('call-timer').style.display = 'block';
                setTouchProtection(true);
                startCallTimer();

                remoteAudioEl.srcObject = remoteStream;
                remoteAudioEl.volume = 0.7; // Comfortable default earpiece volume level
                remoteAudioEl.play().catch(() => {});
            });

            call.on('close', () => {
                executeCleanupAndExit();
            });
        }

        // Manual Speaker Toggle
        function toggleSpeaker() {
            isSpeakerOn = !isSpeakerOn;
            const speakerBtn = document.getElementById('speaker-btn');
            const statusEl = document.getElementById('call-status');
            
            if (isSpeakerOn) {
                speakerBtn.classList.add('active');
                speakerBtn.innerText = "🔊 Speaker ON";
                remoteAudioEl.volume = 1.0; // Max volume for loudspeaker mode
                if(statusEl.innerText.includes("Earpiece")) {
                    statusEl.innerText = statusEl.innerText.replace("Earpiece", "Loudspeaker");
                }
            } else {
                speakerBtn.classList.remove('active');
                speakerBtn.innerText = "🔊 Speaker";
                remoteAudioEl.volume = 0.7; // Return to standard earpiece volume level
                if(statusEl.innerText.includes("Loudspeaker")) {
                    statusEl.innerText = statusEl.innerText.replace("Loudspeaker", "Earpiece");
                }
            }
        }

        function toggleHDMode() {
            isHDActive = !isHDActive;
            updateHDUIState();
            if (dataConnection && dataConnection.open) {
                dataConnection.send({ type: 'HD_SYNC', active: isHDActive });
            }
        }

        function applyRemoteHDState(status) {
            if (isHDActive === status) return;
            isHDActive = status;
            updateHDUIState();
        }

        function updateHDUIState() {
            const hdBtn = document.getElementById('hd-btn');
            const modeText = document.getElementById('mode-text');

            if (isHDActive) {
                hdBtn.classList.add('active');
                hdBtn.innerText = "⚡ HD ON";
                modeText.innerText = "HD Voice Mode Active (High Quality)";
            } else {
                hdBtn.classList.remove('active');
                hdBtn.innerText = "⚡ HD Off";
                modeText.innerText = "Data Saver Mode (2G Optimized)";
            }
        }

        function startCallTimer() {
            if (callTimerInterval) return;
            callTimerInterval = setInterval(() => {
                callSeconds++;
                let mins = Math.floor(callSeconds / 60).toString().padStart(2, '0');
                let secs = (callSeconds % 60).toString().padStart(2, '0');
                document.getElementById('call-timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => { track.enabled = !isMuted; });
            const muteBtn = document.getElementById('mute-btn');
            muteBtn.classList.toggle('active', isMuted);
            muteBtn.innerText = isMuted ? "🔇 Unmute" : "🎙️ Mute";
        }

        function endCallAndClose() {
            if (dataConnection && dataConnection.open) {
                dataConnection.send('END_CALL');
            }
            executeCleanupAndExit();
        }

        function executeCleanupAndExit() {
            stopAlerts();
            if (callTimerInterval) clearInterval(callTimerInterval);
            setTouchProtection(false);
            if (wakeLock !== null) wakeLock.release().catch(() => {});
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            if (currentPeer) currentPeer.destroy();

            document.getElementById('call-status').innerText = "Call Terminated. Returning...";
            
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 600);
        }
    </script>
</body>
</html>
