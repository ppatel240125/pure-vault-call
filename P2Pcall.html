<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>P2P Talk - Secure Call</title>
<style>
    :root {
        --bg: #0b0e14; --surface: #1a1d24; --surface-hover: #252932;
        --primary: #3b82f6; --text: #f3f4f6; --text-muted: #9ca3af;
        --danger: #ef4444; --success: #22c55e; --border: #2d333b;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    
    /* સ્ક્રીન સાઇઝ ફિક્સ (100dvh વાપર્યું છે જેથી મોબાઇલમાં કંઈ કપાય નહીં) */
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body {
        background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif;
        display: flex; flex-direction: column; height: 100dvh; 
    }

    /* 🌟 પહેલી સ્ક્રીન (મેનુ) */
    #start-screen {
        position: fixed; inset: 0; background: var(--bg); z-index: 1000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    }
    #start-screen h1 { font-size: 22px; margin-bottom: 10px; color: var(--primary); }
    .start-btn {
        background: var(--surface); border: 1px solid var(--border); color: var(--text);
        padding: 20px 40px; border-radius: 16px; font-size: 18px; font-weight: bold;
        display: flex; align-items: center; gap: 15px; width: 260px; cursor: pointer;
        transition: 0.2s;
    }
    .start-btn:active { transform: scale(0.95); background: var(--surface-hover); }
    .start-btn svg { width: 28px; height: 28px; fill: var(--primary); }

    /* વિડિયો / ઓડિયો કૉલ સ્ક્રીન */
    #call-ui { display: none; flex-direction: column; width: 100%; height: 100%; }
    
    /* Audio Mode માટે */
    #audio-view {
        flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle, #1a1d24 0%, #000 100%); position: relative;
    }
    .avatar-circle {
        width: 120px; height: 120px; border-radius: 50%; background: var(--surface-hover);
        display: flex; align-items: center; justify-content: center; font-size: 50px;
        border: 2px solid var(--primary); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.4); } 70% { box-shadow: 0 0 0 20px rgba(59,130,246,0); } 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); } }
    
    /* Video Mode માટે */
    #video-view { flex: 1; display: none; flex-direction: column; gap: 2px; background: #000; overflow: hidden; }
    .video-box { flex: 1; position: relative; background: #111; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    #local-video { transform: scaleX(-1); }

    #status-bar {
        position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7);
        padding: 6px 16px; border-radius: 20px; font-size: 13px; z-index: 10;
        display: flex; align-items: center; gap: 8px; backdrop-filter: blur(8px); white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
    .dot.connected { background: var(--success); }

    /* કંટ્રોલ્સ (નીચેનો ભાગ) */
    #controls { 
        background: var(--surface); padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); 
        display: flex; flex-direction: column; gap: 10px; 
        border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 20; flex-shrink: 0;
    }
    .row { display: flex; justify-content: space-between; gap: 10px; }
    button.ctrl {
        flex: 1; padding: 14px 10px; border: none; border-radius: 12px;
        font-size: 14px; font-weight: 600; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        background: var(--surface-hover); color: var(--text); transition: 0.2s;
    }
    button.ctrl:active { transform: scale(0.95); }
    .btn-danger { background: var(--danger); color: #fff; font-size: 16px !important; padding: 16px 10px !important; }
    .btn-saver.active { background: #14532d; color: #bbf7d0; border: 1px solid var(--success); }
    
    /* End Call બટનને ખાસ હાઇલાઇટ કરવા માટે */
    #end-btn { flex: 1; width: 100%; border-radius: 14px; margin-top: 5px; }

    /* Devices મેનુ */
    .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: none; align-items: flex-end; }
    .sheet-overlay.active { display: flex; }
    .sheet-content { background: #111827; width: 100%; border-radius: 24px 24px 0 0; padding: 24px 20px; padding-bottom: max(24px, env(safe-area-inset-bottom)); animation: slideUp 0.3s; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .sheet-header h2 { margin: 0; font-size: 20px; }
    .sheet-close { background: none; border: none; color: var(--text-muted); font-size: 24px; }
    .device-group h3 { font-size: 11px; color: var(--text-muted); margin: 0 0 8px 4px; }
    .device-list { background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 15px;}
    .device-item { display: flex; justify-content: space-between; padding: 14px 16px; font-size: 15px; border-bottom: 1px solid var(--border); }
    .device-item.active { color: var(--primary); }
</style>
</head>
<body>

    <!-- 1. સ્ટાર્ટ સ્ક્રીન -->
    <div id="start-screen">
        <h1>સુરક્ષિત કૉલ શરૂ કરો</h1>
        <button class="start-btn" onclick="startCall('audio')">
            <svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-2.2 2.2a15.045 15.045 0 0 1-6.59-6.59l2.2-2.21a.96.96 0 0 0 .25-1A11.36 11.36 0 0 1 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/></svg>
            ઓડિયો કૉલ
        </button>
        <button class="start-btn" onclick="startCall('video')">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            વિડિયો કૉલ
        </button>
    </div>

    <!-- 2. કૉલ સ્ક્રીન -->
    <div id="call-ui">
        <!-- ઓડિયો મોડ -->
        <div id="audio-view">
            <div id="status-bar"><div class="dot" id="status-dot"></div><span id="status-text">Connecting...</span></div>
            <div class="avatar-circle">👤</div>
            <h2 style="margin-top:20px; color:var(--text-muted);">ઓડિયો કૉલ</h2>
            <audio id="remote-audio" autoplay playsinline></audio>
        </div>

        <!-- વિડિયો મોડ -->
        <div id="video-view">
            <div class="video-box">
                <video id="remote-video" autoplay playsinline></video>
                <div id="status-bar-vid"><div class="dot" id="status-dot-vid"></div><span id="status-text-vid">Connecting...</span></div>
            </div>
            <div class="video-box">
                <video id="local-video" autoplay playsinline muted></video>
            </div>
        </div>

        <!-- કંટ્રોલ પેનલ -->
        <div id="controls">
            <div class="row">
                <button id="mic-btn" class="ctrl" onclick="toggleMic()">🎙️ Mute</button>
                <button id="cam-btn" class="ctrl" onclick="toggleCam()" style="display:none;">📷 Camera</button>
                <button id="saver-btn" class="ctrl btn-saver active" onclick="toggleDataSaver()">📉 Data Saver</button>
                <button id="devices-btn" class="ctrl" onclick="openDevicesSheet()">🎧 Devices</button>
            </div>
            <!-- END CALL બટન (મોટું અને લાલ) -->
            <button id="end-btn" class="ctrl btn-danger" onclick="endCall()">
                🔴 કૉલ સમાપ્ત કરો (End Call)
            </button>
        </div>
    </div>

    <!-- 3. Devices મેનુ -->
    <div id="devices-sheet-overlay" class="sheet-overlay" onclick="closeDevicesSheet(event)">
        <div class="sheet-content" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <h2>Devices</h2>
                <button class="sheet-close" onclick="closeDevicesSheet()">&times;</button>
            </div>
            <div id="devices-list-container"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script>
        const P = new URLSearchParams(location.search);
        const roomId = (P.get('room') || 'room123').replace(/[^a-zA-Z0-9_-]/g, '');
        const role = P.get('role') === 'caller' ? 'caller' : 'receiver';
        const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }];

        let peer = null, activeCall = null, localStream = null;
        let currentMicId = null, callMode = 'audio';
        let isMuted = false, isCamOff = false, isDataSaver = true, retryCount = 0;

        async function startCall(mode) {
            callMode = mode;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('call-ui').style.display = 'flex';

            if (mode === 'audio') {
                document.getElementById('audio-view').style.display = 'flex';
                document.getElementById('video-view').style.display = 'none';
            } else {
                document.getElementById('audio-view').style.display = 'none';
                document.getElementById('video-view').style.display = 'flex';
                document.getElementById('cam-btn').style.display = 'flex';
            }

            const hasMedia = await initMedia(mode);
            if (hasMedia) startPeer();
        }

        async function initMedia(mode) {
            try {
                const constraints = {
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                };
                if (mode === 'video') {
                    constraints.video = isDataSaver ? { width: 320, height: 240, frameRate: 15 } : { width: 1280, height: 720 };
                }
                if (currentMicId) constraints.audio.deviceId = { exact: currentMicId };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                if (mode === 'video') document.getElementById('local-video').srcObject = localStream;
                return true;
            } catch (err) {
                alert("પરમિશન નકારી કાઢવામાં આવી.");
                return false;
            }
        }

        function startPeer() {
            const myId = `p2p_ds_${roomId}_${role}`;
            const targetId = `p2p_ds_${roomId}_${role === 'caller' ? 'receiver' : 'caller'}`;
            
            peer = new Peer(myId, { host: '0.peerjs.com', port: 443, path: '/', secure: true, config: { iceServers: ICE } });

            peer.on('open', () => {
                updateStatus(role === 'caller' ? "કૉલ કરી રહ્યા છીએ..." : "કૉલની રાહ જોઈએ છીએ...");
                if (role === 'caller') setTimeout(() => makeCall(targetId), 1500);
            });

            peer.on('call', (call) => {
                activeCall = call;
                call.answer(localStream);
                setupCall(call);
            });

            peer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    if (retryCount < 10) {
                        retryCount++;
                        updateStatus(`જોડાઈ રહ્યા છીએ... (પ્રયાસ ${retryCount})`);
                        setTimeout(() => makeCall(targetId), 3000);
                    } else { updateStatus("સામેવાળો ઓફલાઇન છે."); }
                }
            });
        }

        function makeCall(targetId) {
            if (!peer || peer.destroyed) return;
            activeCall = peer.call(targetId, localStream);
            if (activeCall) setupCall(activeCall);
        }

        function setupCall(call) {
            call.on('stream', (remoteStream) => {
                if (callMode === 'audio') {
                    document.getElementById('remote-audio').srcObject = remoteStream;
                    document.getElementById('remote-audio').play().catch(e=>{});
                } else {
                    document.getElementById('remote-video').srcObject = remoteStream;
                    document.getElementById('remote-video').play().catch(e=>{});
                }
                updateStatus("કનેક્ટેડ (સુરક્ષિત)");
                document.querySelectorAll('.dot').forEach(d => d.classList.add('connected'));
                retryCount = 0;
            });
        }

        function updateStatus(msg) {
            document.getElementById('status-text').innerText = msg;
            document.getElementById('status-text-vid').innerText = msg;
        }

        // મેનુ ખોલો
        async function openDevicesSheet() {
            document.getElementById('devices-sheet-overlay').classList.add('active');
            const container = document.getElementById('devices-list-container');
            container.innerHTML = 'શોધી રહ્યા છીએ...';

            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const mics = devices.filter(d => d.kind === 'audioinput');

                let html = `<div class="device-group"><h3>MICROPHONE / SPEAKER</h3><div class="device-list">`;
                mics.forEach(d => {
                    let label = d.label || 'Default';
                    if(label.includes('Speakerphone')) label = 'Speakerphone';
                    if(label.includes('Earpiece')) label = 'Headset earpiece';
                    const isActive = currentMicId === d.deviceId || (!currentMicId && d.deviceId === 'default');
                    html += `<div class="device-item ${isActive ? 'active' : ''}" onclick="switchAudio('${d.deviceId}')">
                        <span>${label}</span> ${isActive ? '✓' : ''}
                    </div>`;
                });
                html += `</div></div>`;
                container.innerHTML = html;
            } catch (e) { container.innerHTML = 'એરર આવી.'; }
        }

        // ઈયરપીસ સ્વિચ કરવાની ટ્રીક
        async function switchAudio(deviceId) {
            try {
                if (localStream) localStream.getAudioTracks().forEach(t => t.stop());
                const newStream = await navigator.mediaDevices.getUserMedia({
                    audio: { deviceId: { exact: deviceId }, echoCancellation: true, noiseSuppression: true }
                });
                const newTrack = newStream.getAudioTracks()[0];
                if (isMuted) newTrack.enabled = false;

                if (activeCall && activeCall.peerConnection) {
                    const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'audio');
                    if (sender) await sender.replaceTrack(newTrack);
                }
                const oldTrack = localStream.getAudioTracks()[0];
                if (oldTrack) localStream.removeTrack(oldTrack);
                localStream.addTrack(newTrack);
                currentMicId = deviceId;
                closeDevicesSheet();
            } catch (err) { alert("બદલી શકાયું નહીં."); }
        }

        function toggleMic() {
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
            document.getElementById('mic-btn').innerHTML = isMuted ? '🔇 Unmute' : '🎙️ Mute';
        }
        
        function toggleCam() {
            isCamOff = !isCamOff;
            localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
            document.getElementById('cam-btn').innerHTML = isCamOff ? '🚫 Cam Off' : '📷 Camera';
        }
        
        function toggleDataSaver() {
            isDataSaver = !isDataSaver;
            document.getElementById('saver-btn').classList.toggle('active', isDataSaver);
            document.getElementById('saver-btn').innerHTML = isDataSaver ? '📉 Data Saver' : '📈 HD Mode';
        }
        
        function closeDevicesSheet(e) { 
            if (e && e.target !== e.currentTarget) return; 
            document.getElementById('devices-sheet-overlay').classList.remove('active'); 
        }
        
        function endCall() {
            if (confirm("શું તમે ખરેખર કૉલ કટ કરવા માંગો છો?")) {
                if (activeCall) activeCall.close();
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                if (peer) peer.destroy();
                location.reload();
            }
        }
    </script>
</body>
</html>
