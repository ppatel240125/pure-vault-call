<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Secure Call</title>
<style>
:root{--bg:#0f111a;--surface:#1e2332;--surface-hover:#2a3045;--text:#fff;--text-muted:#8b92a5;--danger:#ef4444;--success:#22c55e}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,sans-serif}
#call-ui{display:flex;flex-direction:column;width:100%;height:100dvh;position:relative}
#audio-view{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,#1e2332 0%,#0f111a 70%);z-index:1}
.bg-blur-avatar{position:absolute;width:300px;height:300px;background:var(--surface-hover);border-radius:50%;filter:blur(80px);opacity:.5;z-index:-1}
.avatar-circle{width:120px;height:120px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:50px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.5);text-transform:uppercase}
#video-view{position:absolute;inset:0;display:none;background:#000;z-index:1}
#remote-video,#local-video{width:100%;height:100%;object-fit:cover}
#local-video-container{position:absolute;top:60px;right:20px;width:90px;height:130px;border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.2);box-shadow:0 4px 12px rgba(0,0,0,.5);z-index:10}
#local-video{transform:scaleX(-1)}
.header{position:absolute;top:max(40px,env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:10;text-shadow:0 2px 4px rgba(0,0,0,.8)}
.header h1{margin:0;font-size:22px;font-weight:600;color:var(--text)}
.header p{margin:4px 0 0;font-size:14px;color:#ddd}
#lock-btn{position:absolute;top:max(20px,env(safe-area-inset-top));right:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;z-index:30;cursor:pointer;backdrop-filter:blur(4px);color:#fff}
#lock-btn:active{background:rgba(255,255,255,.2)}
.controls-container{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:20px;right:20px;background:rgba(30,35,50,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:40px;padding:12px 16px;display:flex;justify-content:space-around;align-items:center;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.05)}
.ctrl-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:0 0;border:none;color:var(--text);cursor:pointer;transition:.2s;width:60px;padding:4px 0}
.ctrl-btn:active{transform:scale(.9)}
.ctrl-btn span{font-size:10px;font-weight:600;color:#aaa;text-align:center}
.ctrl-btn svg,.ctrl-btn .icon{width:24px;height:24px;fill:currentColor}
.ctrl-btn.active span{color:#fff}
#saver-btn.saver-mode{background:#422006;border-radius:12px;border:1px solid #f59e0b}
#saver-btn.saver-mode span{color:#fde047}
#saver-btn.hd-mode{background:#14532d;border-radius:12px;border:1px solid var(--success)}
#saver-btn.hd-mode span{color:#bbf7d0}
.btn-end{background:var(--danger);border-radius:25px;padding:12px 20px;width:auto}
.btn-end svg{fill:#fff;width:24px;height:24px}
.btn-end span{display:none}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.sheet-overlay.active{display:flex}
.sheet-content{background:#141824;width:100%;border-radius:24px 24px 0 0;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom));animation:slideUp .3s cubic-bezier(.16,1,.3,1);color:#fff}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-header{font-size:20px;font-weight:700;margin-bottom:20px}
.device-group h3{font-size:11px;color:var(--text-muted);letter-spacing:1px;margin:0 0 8px 4px;font-weight:600}
.device-list{background:#1e2332;border-radius:16px;overflow:hidden}
.device-item{display:flex;justify-content:space-between;align-items:center;padding:16px;font-size:16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
.device-item:last-child{border-bottom:none}
.device-item:active{background:rgba(255,255,255,.05)}
.check-icon{display:none;width:24px;height:24px;fill:var(--success)}
.device-item.active .check-icon{display:block}
.done-btn{width:100%;padding:16px;background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:700;margin-top:20px;cursor:pointer}
#lock-overlay{position:fixed;inset:0;background:#000;z-index:99999;display:none;align-items:center;justify-content:center;touch-action:none;overscroll-behavior:contain}
#lock-overlay.active{display:flex}
.lock-content{display:flex;align-items:center;justify-content:center;color:#fff;pointer-events:none}
.lock-icon{font-size:28px;line-height:1;margin:0;pointer-events:auto}
</style>
</head>
